<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Tax Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314284b'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='28' fill='%23d9a441' text-anchor='middle'%3EFT%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#14284b;--navy-2:#1f3a66;--gold:#c9973a;--ink:#16213a;--muted:#5f6b7f;--line:#dde3ec;--bg:#f3f5f9;--card:#fff;--ok:#1d7a4e;--ok-soft:#e5f4ec;--bad:#b3261e;--bad-soft:#fbe9e7;--warn-soft:#fff4dc}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select{font:inherit}
.top{background:var(--navy);color:#fff}
.top-in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mark{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;border-bottom:3px solid var(--gold)}
.brand b{display:block;font-size:17px}.brand span{font-size:12.5px;opacity:.8}
.top .sp{flex:1}.who{font-size:13.5px;opacity:.9;text-align:right}
.lnk{all:unset;cursor:pointer;color:#fff;font-weight:600;font-size:13.5px;padding:6px 10px;border-radius:8px}.lnk:hover{background:rgba(255,255,255,.12)}
main{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.login{max-width:400px;margin:40px auto}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #9db6dd;border-color:var(--navy-2)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-2)}
.btn.small{padding:6px 10px;font-size:13px}.btn.danger{color:var(--bad);border-color:#e3b5b0}
.btn:disabled{opacity:.6;cursor:default}
.full{width:100%;margin-top:18px}
.msg{margin-top:12px;font-size:14px;border-radius:8px;padding:10px 12px}.msg:empty{display:none}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.info{background:var(--warn-soft);color:#7a5200}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.tile{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:10px;min-height:190px;transition:box-shadow .15s,transform .15s;position:relative}
.tile:hover{box-shadow:0 10px 30px rgba(20,40,75,.12);transform:translateY(-2px)}
.tile:focus-visible{outline:3px solid #9db6dd}
.tile .ic{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.tile b{font-size:20px}.tile span{color:var(--muted)}
.tile .go{margin-top:auto;font-weight:700;color:var(--navy)}
.tile.locked{cursor:default;opacity:.55}.tile.locked:hover{box-shadow:none;transform:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 8px}
td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.admin{background:#e6ecf7;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.checks{display:flex;gap:18px;align-items:center;margin-top:12px;flex-wrap:wrap}.checks label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.table-wrap{overflow-x:auto}
.note{font-size:13px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;margin:20px 0 12px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.exp{display:flex;flex-wrap:wrap;gap:4px}.exp label{display:inline-flex;align-items:center;gap:3px;margin:0;font-size:12px;font-weight:500;color:var(--ink);background:#f1f4f9;border-radius:6px;padding:2px 6px;white-space:nowrap}
.phone{margin-top:22px}.phone b{display:block;font-size:16px;margin-bottom:4px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.who{display:none}}
</style>
<script src="shared/cloud.js"></script>
<script src="shared/reminders.js"></script>
<script src="shared/notify.js"></script>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="mark">FT</div><div class="brand"><b>Fair Tax Portal</b><span>Fair Tax International FZC</span></div>
  <div class="sp"></div><div class="who" id="who"></div>
</div></header>
<main id="main"><div class="card login"><p class="sub">Loading…</p></div></main>
<script>
(function(){
  var main = document.getElementById('main'), who = document.getElementById('who');
  var esc = function(s){ return FT.esc(s); };
  var params = new URLSearchParams(location.search);
  var me = null;

  function show(html){ main.innerHTML = html; }
  function msg(id, text, cls){ var el = document.getElementById(id); if (el){ el.textContent = text || ''; el.className = 'msg ' + (cls || 'bad'); } }
  function header(){
    who.innerHTML = me ? '<div>' + esc(me.name) + ' <span style="opacity:.7">(' + esc(me.id) + ')</span></div><div>' +
      (me.role === 'admin' ? '<button class="lnk" data-go="users">Users</button>' : '') +
      (me.role === 'admin' ? '' : '<button class="lnk" data-go="password">Change password</button>') + '<button class="lnk" data-go="signout">Sign out</button></div>' : '';
  }

  /* ---------- screens ---------- */
  function login(note){
    me = null; header();
    show('<form class="card login" id="f-login"><h1>Sign in</h1><p class="sub">Use the user ID and password given to you by the admin. There is no sign-up – ask the admin for an account.</p>' +
      '<label for="l-id">User ID</label><input type="text" id="l-id" autocomplete="username" autocapitalize="off" spellcheck="false" required>' +
      '<label for="l-pw">Password</label><input type="password" id="l-pw" autocomplete="current-password" required>' +
      '<button class="btn primary full" id="l-go">Sign in</button>' +
      '<div class="or"><span>Admin</span></div>' +
      '<button type="button" class="btn gbtn" id="l-google"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v8.7h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-16.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>' +
      '<p class="note" style="text-align:center;margin:8px 0 0">Only the registered admin Gmail can use this.</p><div class="msg" id="l-msg"></div></form>');
    document.getElementById('l-google').onclick = async function(){
      var b = this; b.disabled = true; msg('l-msg', '');
      try { me = await FT.signInAdmin(); afterLogin(); }
      catch (err) { if (!/popup-closed|cancelled-popup/.test(err && err.code || '')) msg('l-msg', /popup-blocked/.test(err && err.code || '') ? 'The browser blocked the Google window – allow pop-ups for this site and try again.' : FT.friendlyError(err)); b.disabled = false; }
    };
    if (note) msg('l-msg', note, 'info');
    document.getElementById('l-id').focus();
    document.getElementById('f-login').onsubmit = async function(e){
      e.preventDefault();
      var b = document.getElementById('l-go'); b.disabled = true; b.textContent = 'Signing in…'; msg('l-msg', '');
      try { me = await FT.signIn(document.getElementById('l-id').value, document.getElementById('l-pw').value); afterLogin(); }
      catch (err) { msg('l-msg', FT.friendlyError(err)); b.disabled = false; b.textContent = 'Sign in'; }
    };
  }
  function afterLogin(){
    header();
    var next = params.get('next');
    if (next && FT.canOpen(me, next)){ location.href = next + '/'; return; }
    dashboard();
  }
  function dashboard(){
    var tile = function(app, color, letters, title, text){
      var ok = FT.canOpen(me, app);
      return '<button class="tile' + (ok ? '' : ' locked') + '" ' + (ok ? 'data-open="' + app + '"' : 'aria-disabled="true"') + '>' +
        '<div class="ic" style="background:' + color + '">' + letters + '</div><b>' + title + '</b><span>' + text + '</span>' +
        '<span class="go">' + (ok ? 'Open →' : 'No access – ask the admin') + '</span></button>';
    };
    show('<h1>Welcome, ' + esc(me.name) + '</h1><p class="sub">Choose where to work.</p><div class="tiles">' +
      tile('crm', '#0f9d6b', 'CRM', 'CRM', 'Leads, clients, tasks, quotations, invoices and receipts – with an AI assistant you can talk to.') +
      tile('audit', '#14284b', 'FS', 'Audit Desk', 'Financial statements, audit reports, policies and proof documents.') +
      (me.role === 'admin' ? '<button class="tile" data-go="users"><div class="ic" style="background:#c9973a">👥</div><b>Users &amp; access</b><span>Add users, choose CRM / Audit access, expertise, block users.</span><span class="go">Manage →</span></button>' : '') +
      '</div>' + phoneCard());
    if (FTNotify.native() && FT.canOpen(me, 'crm')) FTNotify.scheduleFromCloud().then(function(){ var pc = document.getElementById('phone-state'); if (pc) pc.outerHTML = phoneState(); });
  }
  var APK_URL = 'https://github.com/AsifKhan170920/audit-desk/releases/latest/download/FairTaxPortal.apk';
  function phoneState(){
    var st = FTNotify.status();
    return '<div id="phone-state">' + (st ? '<p class="' + (st.ok ? 'note' : 'msg info') + '">' + esc(st.text) + '</p>' + (st.ok ? '' : '<button class="btn primary" data-go="notify-on">Turn on notifications</button>') : '') + '</div>';
  }
  function phoneCard(){
    if (FTNotify.native()) return '<div class="card phone"><b>📱 Reminders on this phone</b>' + (FT.canOpen(me, 'crm') ? phoneState() : '<p class="note">Reminders come from the CRM – ask the admin for CRM access.</p>') + '</div>';
    return '<div class="card phone"><b>📱 Android app with reminders</b><p class="note" style="margin:0 0 10px">Lead follow-ups, client check-ins, meetings, VAT / Corporate Tax / audit deadlines, contract expiry and cheque reminders as phone notifications.</p>' +
      '<div class="row"><a class="btn primary" href="' + APK_URL + '">Download the app (APK)</a><span class="note">On the phone: open this page, download, then allow “Install unknown apps” for your browser when Android asks.</span></div></div>';
  }
  async function users(){
    if (me.role !== 'admin') return dashboard();
    show('<div class="row between"><div><h1>Users &amp; access</h1><p class="sub">Each person gets their own user ID and password. Tick what they may open.</p></div><button class="btn" data-go="home">← Dashboard</button></div>' +
      '<form class="card" id="f-add"><h2>Add a user</h2><div class="grid">' +
      '<div><label for="u-name">Name</label><input type="text" id="u-name" required placeholder="e.g. Waseem"></div>' +
      '<div><label for="u-id">User ID (or email)</label><input type="text" id="u-id" required autocapitalize="off" spellcheck="false" placeholder="e.g. waseem"></div>' +
      '<div><label for="u-pw">Password (at least 8 characters)</label><input type="text" id="u-pw" required minlength="8" autocomplete="off"></div></div>' +
      '<div class="checks"><span class="note">May open:</span><label><input type="checkbox" id="u-crm" checked> CRM</label><label><input type="checkbox" id="u-audit"> Audit Desk</label></div>' +
      '<div class="checks"><span class="note">Expertise (for automatic client assignment):</span>' + FTReminders.EXPERTISE.map(function(x, i){ return '<label><input type="checkbox" class="u-exp" value="' + x + '"> ' + x + '</label>'; }).join('') + '</div>' +
      '<div class="row" style="margin-top:14px"><button class="btn primary" id="u-go">Add user</button><span class="note">Then share the user ID and password with the person. Google may ask you to confirm your admin account the first time.</span></div><div class="msg" id="u-msg"></div></form>' +
      '<div class="card" style="margin-top:18px"><h2>All users</h2><div class="table-wrap" id="u-list"><p class="sub">Loading…</p></div><div class="msg" id="l-msg2"></div></div>' +
      '<form class="card" id="f-ai" style="margin-top:18px"><h2>Claude AI assistant in the CRM</h2><p class="sub" id="ai-state">Checking…</p>' +
      '<div class="grid"><div><label for="ai-key">Claude API key for all staff</label><input type="password" id="ai-key" autocomplete="off" spellcheck="false" placeholder="sk-ant-…"></div>' +
      '<div><label for="ai-model">Model</label><select id="ai-model"><option value="claude-sonnet-5">Claude Sonnet 5 – recommended</option><option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 – fastest, lowest cost</option><option value="claude-opus-5">Claude Opus 5 – most careful</option></select></div></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn primary" id="ai-go">Save</button><button type="button" class="btn danger" id="ai-del">Remove shared key</button>' +
      '<span class="note">Signed-in staff use this key for the assistant. Anyone with portal access could see the key in their browser tools, so use a key with a monthly spending limit (console.anthropic.com → Limits). Staff can also use their own key instead.</span></div><div class="msg" id="ai-msg"></div></form>');
    aiCard();
    if (FT.isNative()) document.getElementById('f-add').outerHTML = '<div class="card msg info">Adding users, setting passwords, blocking and deleting are done from a computer (portal website). You can change access and expertise here.</div>';
    var fAdd = document.getElementById('f-add'); if (fAdd) fAdd.onsubmit = async function(e){
      e.preventDefault();
      var b = document.getElementById('u-go'); b.disabled = true; b.textContent = 'Adding…'; msg('u-msg', '');
      var u = {name: document.getElementById('u-name').value.trim(), id: document.getElementById('u-id').value.trim(), password: document.getElementById('u-pw').value,
        crm: document.getElementById('u-crm').checked, audit: document.getElementById('u-audit').checked,
        expertise: [].slice.call(document.querySelectorAll('.u-exp')).filter(function(x){ return x.checked; }).map(function(x){ return x.value; })};
      var shareText = 'Fair Tax Portal: https://asifkhan170920.github.io/audit-desk/  User ID: ' + FT.idFromEmail(FT.emailFor(u.id)) + '  Password: ' + u.password;
      try { await FT.addUser(u); await refreshTeam(); msg('u-msg', 'User added. Share this with ' + (u.name || u.id) + ': ' + shareText, 'ok'); this.reset(); document.getElementById('u-crm').checked = true; await list(); }
      catch (err) { msg('u-msg', FT.friendlyError(err)); }
      b.disabled = false; b.textContent = 'Add user';
    };
    await list();
  }
  async function refreshTeam(){ try { await FT.saveTeam(await FT.listUsers()); } catch (e) { console.warn('team', e); } }
  async function aiCard(){
    var ai = await FT.getAi(), st = document.getElementById('ai-state'); if (!st) return;
    st.textContent = ai.key ? 'A shared key is saved (ending …' + String(ai.key).slice(-4) + ')' + (ai.updatedBy ? ' by ' + ai.updatedBy : '') + '. Enter a new key only to replace it.' : 'No shared key yet. Without one, each person must add their own key inside the CRM assistant.';
    if (ai.model) document.getElementById('ai-model').value = ai.model;
    document.getElementById('f-ai').onsubmit = async function(e){
      e.preventDefault();
      var k = document.getElementById('ai-key').value.trim(), f = {model: document.getElementById('ai-model').value};
      if (k){ if (!/^sk-ant-/.test(k)) return msg('ai-msg', 'That does not look like a Claude API key (it starts with sk-ant-).'); f.key = k; }
      try { await FT.setAi(f); document.getElementById('ai-key').value = ''; msg('ai-msg', 'Saved.', 'ok'); aiCard(); } catch (err) { msg('ai-msg', FT.friendlyError(err)); }
    };
    document.getElementById('ai-del').onclick = async function(){
      try { await FT.setAi({key: ''}); msg('ai-msg', 'Shared key removed.', 'ok'); aiCard(); } catch (err) { msg('ai-msg', FT.friendlyError(err)); }
    };
  }
  async function list(){
    var box = document.getElementById('u-list'); if (!box) return;
    try {
      var all = await FT.listUsers();
      var expBoxes = function(u){ var ex = u.expertise || []; return '<div class="exp">' + FTReminders.EXPERTISE.map(function(x){ return '<label><input type="checkbox" data-exp="' + x + '" data-uid="' + u.uid + '"' + (ex.indexOf(x) >= 0 ? ' checked' : '') + '>' + x + '</label>'; }).join('') + '</div>'; };
      var mine = all.filter(function(u){ return u.uid === me.uid; })[0] || {uid: me.uid, expertise: me.expertise || []};
      box.innerHTML = '<table><thead><tr><th>Name</th><th>User ID</th><th>CRM</th><th>Audit</th><th>Expertise</th><th>Status</th><th></th></tr></thead><tbody>' +
        '<tr><td>' + esc(me.name) + ' <span class="tag admin">Admin</span></td><td>' + esc(FT.OWNER_EMAIL) + '</td><td>✓</td><td>✓</td><td>' + expBoxes(mine) + '</td><td><span class="tag ok">Google sign-in</span></td><td><span class="note">you</span></td></tr>' +
        all.filter(function(u){ return u.uid !== me.uid; }).map(function(u){
          var apps = u.apps || {};
          return '<tr><td>' + esc(u.name) + '</td><td>' + esc(u.id) + '</td>' +
            '<td><input type="checkbox" data-uid="' + u.uid + '" data-f="crm"' + (apps.crm ? ' checked' : '') + ' aria-label="CRM access"></td>' +
            '<td><input type="checkbox" data-uid="' + u.uid + '" data-f="audit"' + (apps.audit ? ' checked' : '') + ' aria-label="Audit access"></td>' +
            '<td>' + expBoxes(u) + '</td>' +
            '<td>' + (u.active ? '<span class="tag ok">Active</span>' : '<span class="tag bad">Blocked</span>') + '</td>' +
            '<td class="row"><button class="btn small" data-pw="' + u.uid + '" data-name="' + esc(u.name || u.id) + '" data-id="' + esc(u.id) + '">Set new password</button>' +
            '<button class="btn small' + (u.active ? ' danger' : '') + '" data-block="' + u.uid + '" data-active="' + (u.active ? 1 : 0) + '">' + (u.active ? 'Block' : 'Unblock') + '</button>' +
            '<button class="btn small danger" data-del="' + u.uid + '" data-name="' + esc(u.name || u.id) + '">Delete</button></td></tr>';
        }).join('') + '</tbody></table>' +
        '<p class="note">Forgotten password: click “Set new password”, then share the new password with the person. Blocked users cannot sign in. Expertise decides who new CRM clients are assigned to (best match, then fewest active clients).</p>';
      if (FT.isNative()) box.querySelectorAll('[data-pw],[data-del],[data-block]').forEach(function(b){ b.remove(); });
    } catch (err) { box.innerHTML = '<p class="msg bad">' + esc(FT.friendlyError(err)) + '</p>'; }
  }
  function password(){
    show('<form class="card login" id="f-pw"><h1>Change password</h1>' +
      '<label for="p-cur">Current password</label><input type="password" id="p-cur" required autocomplete="current-password">' +
      '<label for="p-new">New password (at least 8 characters)</label><input type="password" id="p-new" required minlength="8" autocomplete="new-password">' +
      '<label for="p-new2">Repeat new password</label><input type="password" id="p-new2" required minlength="8" autocomplete="new-password">' +
      '<div class="row" style="margin-top:18px"><button class="btn primary" id="p-go">Change password</button><button type="button" class="btn" data-go="home">Cancel</button></div><div class="msg" id="p-msg"></div></form>');
    document.getElementById('f-pw').onsubmit = async function(e){
      e.preventDefault();
      if (document.getElementById('p-new').value !== document.getElementById('p-new2').value) return msg('p-msg', 'The two new passwords are not the same.');
      try { await FT.changeMyPassword(document.getElementById('p-cur').value, document.getElementById('p-new').value); msg('p-msg', 'Password changed.', 'ok'); this.reset(); }
      catch (err) { msg('p-msg', FT.friendlyError(err)); }
    };
  }

  /* ---------- clicks ---------- */
  document.addEventListener('click', async function(e){
    var t = e.target.closest('[data-go],[data-open],[data-block],[data-pw],[data-del],[data-pwsave]'); if (!t) return;
    if (t.dataset.open){ location.href = t.dataset.open + '/'; return; }
    if (t.dataset.go === 'home') return dashboard();
    if (t.dataset.go === 'users') return users();
    if (t.dataset.go === 'password') return password();
    if (t.dataset.go === 'notify-on'){ t.disabled = true; await FTNotify.enable(); var pc = document.getElementById('phone-state'); if (pc) pc.outerHTML = phoneState(); return; }
    if (t.dataset.go === 'signout'){ t.textContent = 'Signing out…'; await FT.signOut(); return login('You are signed out.'); }
    if (t.dataset.block){ t.disabled = true; try { await FT.setUserActive(t.dataset.block, t.dataset.active !== '1'); msg('l-msg2', 'Saved.', 'ok'); await list(); await refreshTeam(); } catch (err) { msg('l-msg2', FT.friendlyError(err)); t.disabled = false; } return; }
    if (t.dataset.pw){
      var row = t.closest('tr'), old = document.getElementById('pw-row'); if (old) old.remove();
      var tr = document.createElement('tr'); tr.id = 'pw-row';
      tr.innerHTML = '<td colspan="7"><div class="row"><b>New password for ' + esc(t.dataset.name) + ':</b><input type="text" id="pw-new" minlength="8" autocomplete="off" style="max-width:240px" placeholder="at least 8 characters">' +
        '<button class="btn small primary" data-pwsave="' + t.dataset.pw + '" data-id="' + t.dataset.id + '">Save password</button><button class="btn small" data-go="cancel-pw">Cancel</button></div></td>';
      row.after(tr); document.getElementById('pw-new').focus(); return;
    }
    if (t.dataset.pwsave){
      var np = document.getElementById('pw-new').value;
      if (np.length < 8) return msg('l-msg2', 'The password must be at least 8 characters.');
      t.disabled = true;
      try { await FT.setUserPassword(t.dataset.pwsave, np); msg('l-msg2', 'Password changed. Share it with the user – User ID: ' + t.dataset.id + '  Password: ' + np, 'ok'); document.getElementById('pw-row').remove(); }
      catch (err) { msg('l-msg2', FT.friendlyError(err)); t.disabled = false; }
      return;
    }
    if (t.dataset.go === 'cancel-pw'){ var r = document.getElementById('pw-row'); if (r) r.remove(); return; }
    if (t.dataset.del){
      if (t.dataset.confirm !== '1'){ t.dataset.confirm = '1'; t.textContent = 'Click again to delete ' + t.dataset.name; setTimeout(function(){ if (t.isConnected){ t.dataset.confirm = ''; t.textContent = 'Delete'; } }, 5000); return; }
      t.disabled = true;
      try { await FT.deleteUser(t.dataset.del); msg('l-msg2', t.dataset.name + ' deleted.', 'ok'); await list(); await refreshTeam(); } catch (err) { msg('l-msg2', FT.friendlyError(err)); t.disabled = false; }
      return;
    }
  });
  document.addEventListener('change', async function(e){
    var el = e.target; if (!el.dataset || !el.dataset.uid) return;
    if (el.dataset.exp){
      var boxes = [].slice.call(document.querySelectorAll('input[data-exp][data-uid="' + el.dataset.uid + '"]'));
      var ex = boxes.filter(function(b){ return b.checked; }).map(function(b){ return b.dataset.exp; });
      try {
        if (el.dataset.uid === me.uid) { await FT.db.collection('users').doc(me.uid).set({expertise: ex, name: me.name, role: 'admin', id: me.id}, {merge: true}); me.expertise = ex; FT.me.expertise = ex; }
        else await FT.updateUser(el.dataset.uid, {expertise: ex});
        await refreshTeam(); msg('l-msg2', 'Expertise saved.', 'ok');
      } catch (err) { msg('l-msg2', FT.friendlyError(err)); }
      return;
    }
    var f = el.dataset.f, fields = {};
    fields['apps.' + f] = el.checked;
    try { await FT.updateUser(el.dataset.uid, fields); await refreshTeam(); msg('l-msg2', 'Saved.', 'ok'); }
    catch (err) { msg('l-msg2', FT.friendlyError(err)); }
  });

  /* ---------- start ---------- */
  (async function(){
    try {
      var u = await FT.currentUser();
      if (u && !u.missing && !u.error && u.active){ me = u; return afterLogin(); }
      if (u) await FT.auth.signOut();
      login(params.get('next') ? 'Please sign in to open ' + (FT.APPS[params.get('next')] || {name: 'the app'}).name + '.' : '');
    } catch (err) {
      show('<div class="card login"><h1>Portal not ready</h1><p class="msg bad">' + esc(FT.friendlyError(err)) + '</p></div>');
    }
  })();
})();
</script>
</body>
</html>
