    case'svc-complete-btn':openServiceCompleteModal(el.getAttribute('data-id'));break;
    case'confirm-svc-complete':{svcComplete(db,id,($('#svcCNote')||{}).value||'');save();closeModal();toast('Service completed → moved to Retention');route();break;}
    case'svc-reactivate':{svcReactivate(db,el.getAttribute('data-id'));runServiceEngine(db);save();toast('Service reactivated');route();break;}
    case'svc-snooze':{const r=svcSnooze(db,id,($('#svcNote')||{}).value||'');save();toast(r.sticky?'Logged · stays until deadline':'Logged · next follow-up '+(r.next?fmtDate(r.next):''));if(r.kept)route();else location.hash='#/tasks';break;}
    case'svc-setdate':{const dt=($('#svcDate')||{}).value;if(!dt){toast('Pick a date');return;}const r=svcSetDate(db,id,dt,($('#svcNote')||{}).value||'');save();toast(r.capped?'Date capped to the submission deadline':'Next follow-up set');if(r.kept)route();else location.hash='#/tasks';break;}
    case'svc-done':{svcComplete(db,id,($('#svcNote')||{}).value||'');save();toast('Service completed → Retention');location.hash='#/tasks';break;}
    /* invoices */
    case'new-invoice':{modal(`<div class="modal"><div class="modal-head"><h3>New Invoice</h3><button class="x" data-act="close">×</button></div><div class="field"><label>Select Client</label><select id="m_ref">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button class="btn btn-primary" style="width:100%" data-act="save-invoice-modal">＋ Create Invoice</button></div>`);break;}
    case'save-invoice-modal':{const inv=mkInvoice(db,$('#m_ref').value);save();closeModal();location.hash='#/invoice/'+inv.id;break;}
    case'new-invoice-for':{const inv=mkInvoice(db,id);save();toast('Invoice created');location.hash='#/invoice/'+inv.id;break;}
    case'inv-add-item':{const v=db.invoices.find(x=>x.id===id);v.items.push({desc:'',qty:1,unit:0,vat:'standard'});save();renderInvoiceBuilder(id);break;}
    case'inv-del-item':{const v=db.invoices.find(x=>x.id===id);v.items.splice(+el.getAttribute('data-i'),1);save();renderInvoiceBuilder(id);break;}
    case'save-invoice':{save();toast('Invoice saved');route();break;}
    case'finalize-invoice':{const v=db.invoices.find(x=>x.id===id);save();toast('Opening preview');route();printInvoice(v);break;}
    case'print-invoice':{const v=db.invoices.find(x=>x.id===id);printInvoice(v);break;}
    case'del-invoice':db.invoices=db.invoices.filter(v=>v.id!==id);save();location.hash='#/invoices';toast('Invoice deleted');break;
    /* receipts */
    case'new-receipt':{modal(`<div class="modal"><div class="modal-head"><h3>New Receipt</h3><button class="x" data-act="close">×</button></div><div class="field"><label>Select Client</label><select id="m_ref">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button class="btn btn-primary" style="width:100%" data-act="save-receipt-modal">＋ Create Receipt</button></div>`);break;}
    case'save-receipt-modal':{const rc=mkReceipt(db,$('#m_ref').value);save();closeModal();location.hash='#/receipt/'+rc.id;break;}
    case'new-receipt-for':{const rc=mkReceipt(db,id);save();toast('Receipt created');location.hash='#/receipt/'+rc.id;break;}
    case'save-receipt':{syncPdcTask(db,db.receipts.find(x=>x.id===id));save();toast('Receipt saved');route();break;}
    case'finalize-receipt':{const rc=db.receipts.find(x=>x.id===id);syncPdcTask(db,rc);save();toast(rc.method==='PDC'?'Saved · PDC reminder set':'Receipt saved — opening preview');route();printReceipt(rc);break;}
    case'print-receipt':{const rc=db.receipts.find(x=>x.id===id);printReceipt(rc);break;}
    case'del-receipt':{const rc=db.receipts.find(x=>x.id===id);if(rc&&rc.taskId)db.tasks=db.tasks.filter(t=>t.id!==rc.taskId);db.receipts=db.receipts.filter(x=>x.id!==id);save();location.hash='#/receipts';toast('Receipt deleted');break;}
    case'agr-for-client':{const c=db.clients.find(x=>x.id===id);const a={id:uid('a'),title:'Service Agreement',clientId:id,clientName:c?c.name:'',clientLicence:c?(c.tradeLicence||''):'',reference:'',amount:0,status:'Draft',date:ymd(new Date()),...agTemplate(0)};a.items=[{desc:'',period:'',amount:0}];db.agreements.unshift(a);save();location.hash='#/agreement/'+a.id;break;}
    case'quo-for-client':{const c=db.clients.find(x=>x.id===id);const q={id:uid('q'),title:'Service Quotation',forType:'client',refId:id,refName:c?c.name:'',clientLicence:c?(c.tradeLicence||''):'',reference:'',amount:0,status:'Draft',date:ymd(new Date()),intro:'We are pleased to present this quotation for our below mentioned scope of services.',scope:[],items:[{desc:'',period:'',amount:0}],closing:'We look forward to working with you and assure you of our best service at all times.',signatory:'Muhammad Asif Khan',signatoryTitle:'Managing Director',email:'asif@fairtaxint.com'};db.quotations.unshift(q);save();location.hash='#/quotation/'+q.id;break;}
    case'quote-to-invoice':{const q=db.quotations.find(x=>x.id===id);let clientId=q.forType==='client'?q.refId:((db.clients.find(c=>c.name===q.refName)||{}).id||null);const c=db.clients.find(x=>x.id===clientId);const inv={id:uid('inv'),title:'Tax Invoice',invoiceNo:'INV-'+new Date().getFullYear()+'-'+String(db.invoices.length+1).padStart(3,'0'),clientId:clientId,clientName:q.refName||(c?c.name:''),trn:(c&&c.trn&&c.trn!=='-'?c.trn:''),date:ymd(new Date()),dueDate:ymd(new Date(Date.now()+14*864e5)),vatRate:q.vatRate!=null?q.vatRate:5,status:'Unpaid',items:(q.items||[]).map(it=>({desc:it.desc,qty:1,unit:itemAmt(it),vat:it.vat||'standard'})),notes:q.reference?('Ref quotation '+q.reference):'',bank:biz().bank};db.invoices.unshift(inv);save();toast('Invoice created from quotation');location.hash='#/invoice/'+inv.id;break;}
  }
}

/* ============================================================= INLINE EDITS */
document.addEventListener('change',e=>{
  const t=e.target,db=load();const id=t.getAttribute&&t.getAttribute('data-id');
  if(t.hasAttribute&&t.hasAttribute('data-sc')){const a=db.agreements.find(x=>x.id===id);const rid=t.getAttribute('data-row');const r=(a.schedule||[]).find(x=>x.id===rid);if(r){const f=t.getAttribute('data-sc');r[f]=(f==='amount')?(+t.value||0):t.value;syncPaymentTasks(db,a);save();if(f==='method')renderAgreementBuilder(id);}return;}
  if(t.hasAttribute&&t.hasAttribute('data-biz')){const db2=load();db2.business=Object.assign({},BIZ_DEFAULT,db2.business||{});db2.business[t.getAttribute('data-biz')]=t.value;save();return;}
  if(t.hasAttribute&&t.hasAttribute('data-inv')){const v=db.invoices.find(x=>x.id===id);const f=t.getAttribute('data-inv');v[f]=t.value;save();if(f==='vatRate')renderInvoiceBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-ii')){const v=db.invoices.find(x=>x.id===id);const i=+t.getAttribute('data-i');const f=t.getAttribute('data-ii');v.items[i][f]=(f==='desc'||f==='vat')?t.value:(+t.value||0);save();renderInvoiceBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-rc')){const rc=db.receipts.find(x=>x.id===id);const f=t.getAttribute('data-rc');rc[f]=(f==='amount')?(+t.value||0):t.value;if(f==='method')rc.isPDC=(t.value==='PDC');save();if(['method','amount'].includes(f))renderReceiptBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-pay')){const k=t.getAttribute('data-pay');const arr=k==='q'?db.quotations:db.agreements;const dd=arr.find(x=>x.id===id);dd.paymentMode=t.value;
    if(t.value==='advance')dd.payment='100% of the total professional fee is payable in advance before commencement of the Services.';
    else if(t.value==='split')dd.payment='50% of the fee in advance and the remaining 50% upon completion of the Services.';
    else if(t.value==='cheques'&&(!dd.cheques||!dd.cheques.length))dd.cheques=[{type:'CDC',date:'',amount:0}];
    save();k==='q'?renderQuotationBuilder(id):renderAgreementBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-chq')){const k=t.getAttribute('data-k');const arr=k==='q'?db.quotations:db.agreements;const dd=arr.find(x=>x.id===id);const i=+t.getAttribute('data-i');const f=t.getAttribute('data-chq');dd.cheques[i][f]=(f==='amount')?(+t.value||0):t.value;save();k==='q'?renderQuotationBuilder(id):renderAgreementBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-catalog')){const k=t.getAttribute('data-catalog');const arr=k==='q'?db.quotations:db.agreements;const dd=arr.find(x=>x.id===id);const v=t.value;if(v&&SCOPE_CATALOG[v]){dd.scope=dd.scope||[];dd.scope.push({heading:v,items:[...SCOPE_CATALOG[v]]});save();k==='q'?renderQuotationBuilder(id):renderAgreementBuilder(id);}return;}
  if(t.hasAttribute&&t.hasAttribute('data-scope-h')){const k=t.getAttribute('data-scope-h');const arr=k==='q'?db.quotations:db.agreements;const dd=arr.find(x=>x.id===id);dd.scope[+t.getAttribute('data-i')].heading=t.value;save();return;}
  if(t.hasAttribute&&t.hasAttribute('data-scope-i')){const k=t.getAttribute('data-scope-i');const arr=k==='q'?db.quotations:db.agreements;const dd=arr.find(x=>x.id===id);dd.scope[+t.getAttribute('data-i')].items=t.value.split('\n').map(s=>s.trim()).filter(Boolean);save();return;}
  if(t.hasAttribute&&t.hasAttribute('data-edit')){const task=db.tasks.find(x=>x.id===id);const f=t.getAttribute('data-edit');const old=task.status;task[f]=t.value;
    if(f==='status'&&t.value==='Completed'&&old!=='Completed'&&task.recurrence&&task.recurrence!=='None'){nextRecurring(db,task);}save();if(f==='status')route();return;}
  if(t.hasAttribute&&t.hasAttribute('data-q')){const f=t.getAttribute('data-q');const q=db.quotations.find(x=>x.id===id);q[f]=t.value;save();if(f==='periodType'||f==='vatRate')renderQuotationBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-a')){const f=t.getAttribute('data-a');const a=db.agreements.find(x=>x.id===id);a[f]=t.value;save();if(f==='periodType'||f==='vatRate')renderAgreementBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-qi')){const q=db.quotations.find(x=>x.id===id);const i=+t.getAttribute('data-i');const f=t.getAttribute('data-qi');q.items[i][f]=(f==='desc'||f==='period'||f==='vat')?t.value:(+t.value||0);save();renderQuotationBuilder(id);return;}
  if(t.hasAttribute&&t.hasAttribute('data-ai')){const a=db.agreements.find(x=>x.id===id);const i=+t.getAttribute('data-i');const f=t.getAttribute('data-ai');a.items[i][f]=(f==='desc'||f==='period'||f==='vat')?t.value:(+t.value||0);save();renderAgreementBuilder(id);return;}
});
/* the next occurrence of a recurring task only appears shortly before it is due (2 days for weekly, 7 monthly, 14 quarterly, 30 annual) */
const RECUR_LEAD={'Weekly':2,'Monthly':7,'Quarterly':14,'Annual':30};
function nextRecurring(db,task){const add={'Weekly':7,'Monthly':30,'Quarterly':91,'Annual':365}[task.recurrence]||0;if(!add)return;const nd=ymd(new Date(new Date(task.dueDate+'T00:00:00').getTime()+add*864e5));
  const t={...task,id:uid('t'),status:'Not Started',dueDate:nd,comments:[],checklistDone:[],completedAt:undefined,createdBy:'System',createdAt:ymd(new Date())},show=ymd(new Date(new Date(nd+'T00:00:00').getTime()-(RECUR_LEAD[task.recurrence]||7)*864e5));
  if(show<=ymd(new Date())){db.tasks.unshift(t);toast('Next one created – due '+fmtDate(nd));}
  else{(db.upcoming=db.upcoming||[]).push({showFrom:show,task:t});toast('Next one will appear on '+fmtDate(show)+' (due '+fmtDate(nd)+')');}}

/* ============================================================= DRAG & DROP */
let dragId=null,dragType=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(!c)return;dragId=c.getAttribute('data-id');dragType=c.getAttribute('data-drag');c.classList.add('dragging');});
document.addEventListener('dragend',e=>{const c=e.target.closest('[data-drag]');if(c)c.classList.remove('dragging');document.querySelectorAll('.dropok').forEach(x=>x.classList.remove('dropok'));});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('dropok');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z)z.classList.remove('dropok');});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!dragId)return;e.preventDefault();const db=load();const kind=z.getAttribute('data-drop');
  if(kind==='stage'&&dragType==='lead'){const l=db.leads.find(x=>x.id===dragId);if(l)l.stage=z.getAttribute('data-stage');save();renderLeads();}
  if(kind==='partner'&&dragType==='client'){const c=db.clients.find(x=>x.id===dragId);if(c)c.partnerId=z.getAttribute('data-partner');save();renderClients();toast('Client reassigned');}
  if(kind==='status'&&dragType==='task'){const t=db.tasks.find(x=>x.id===dragId);const old=t.status;const ns=z.getAttribute('data-status');t.status=ns;if(ns==='Completed'&&old!=='Completed'&&t.recurrence&&t.recurrence!=='None')nextRecurring(db,t);save();renderTasks();}
  dragId=null;dragType=null;});

/* ============================================================= INIT */
load();route();
</script>
