<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fair Tax">
<meta name="theme-color" content="#14284b">
<title>CRM – Fair Tax Portal</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;font:15px "Segoe UI",system-ui,Arial,sans-serif;color:#14284b}.box{text-align:center}.sp{width:34px;height:34px;border-radius:50%;border:3px solid #cfd8e6;border-top-color:#0f9d6b;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}a{color:#14284b}</style>
<script src="../shared/cloud.js"></script></head>
<body><div class="box"><div class="sp"></div><div id="ft-msg">Loading…</div><p><a href="../">Back to dashboard</a></p></div>
<script>
// ?embed=1 → only the AI assistant is shown (used inside the dashboard / Audit Desk)
var EMBED = /[?&]embed=1\b/.test(location.search);
FT.openApp('crm', 'app.html', async function (me) {
  if (EMBED) { var bar = document.querySelector('.ft-bar'); if (bar) bar.remove(); }
  // show the signed-in person in the CRM's top bar
  var name = me.name || me.id, initials = name.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
  var av = document.querySelector('.nav .avatar'); if (av) { av.textContent = initials; if (av.nextElementSibling) av.nextElementSibling.textContent = name; }
  // team directory (names + expertise) for assignment and reminders
  try { window.FT_TEAM = await FT.getTeam(); } catch (e) { window.FT_TEAM = []; }
  var V = '?v=6';
  function add(src) { return new Promise(function (res) { var s = document.createElement('script'); s.src = src + V; s.onload = res; s.onerror = res; document.body.appendChild(s); }); }
  await add('../shared/reminders.js');                 // reminder engine
  if (!EMBED) await add('../shared/notify.js');        // phone notifications (Android app)
  await add('../shared/crm-plus.js');                  // reminders page, policies, auto-assignment, schedules
  await add('../shared/crm-ai.js');                    // AI assistant (type or speak instructions)
});
</script></body></html>
