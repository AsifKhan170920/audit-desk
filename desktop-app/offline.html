<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fair Tax – offline</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;font:15px "Segoe UI",system-ui,sans-serif;color:#14284b}
.box{background:#fff;border-radius:16px;padding:32px 36px;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(20,40,75,.12)}
h1{font-size:20px;margin:0 0 8px}p{color:#4b5563;margin:0 0 18px;line-height:1.5}button{border:0;border-radius:10px;background:#0f9d6b;color:#fff;font:600 15px "Segoe UI",sans-serif;padding:11px 22px;cursor:pointer}</style></head>
<body><div class="box"><h1>No internet connection</h1><p>Fair Tax needs the internet to open the CRM and Audit Desk. Reminders already planned will still pop up.</p>
<button id="r">Try again</button></div>
<script>document.getElementById('r').onclick = function () { if (window.ftDesktop) ftDesktop.retry(); else location.reload(); }; setTimeout(function () { if (navigator.onLine && window.ftDesktop) ftDesktop.retry(); }, 15000);</script>
</body></html>
