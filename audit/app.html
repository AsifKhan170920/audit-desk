<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Tax Audit Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.12/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.12/vfs_fonts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#1A2130; --muted:#5D6879; --line:#DBE0E8;
  --primary:#16294A; --on-primary:#FFFFFF; --accent:#9A7430; --accent-soft:#F4ECDC;
  --ok:#2A7855; --ok-soft:#E2F2E9; --warn:#A06510; --warn-soft:#FBF0DC; --bad:#AE3A33; --bad-soft:#F9E4E2; --hover:#EDF0F5;
  --shadow:0 12px 32px rgba(22,41,74,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;border-bottom:3px solid var(--accent)}
.brand b{display:block;font-size:17px}.brand span{color:var(--muted);font-size:13px}
.top-right{display:flex;gap:10px;align-items:center}
#saved{font-size:12.5px;color:var(--muted)}
nav.side{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;align-self:start;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.side-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.side-client{padding:2px 10px 6px;font-weight:700;font-size:14px;line-height:1.3}
.side-year{padding:0 10px 8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.side-year select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.nav-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px}
.nav-btn:hover{background:var(--hover)}
.nav-btn[aria-current="true"]{background:var(--primary);color:#fff;font-weight:600}
.nav-btn svg{width:17px;height:17px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel.flush{padding:0;overflow:hidden}.panel-in{padding:14px 18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:23px;margin:0;line-height:1.2;text-wrap:balance}h2{font-size:17px;margin:0 0 6px}.h3{font-size:15px;margin:14px 0 8px}
.sub{color:var(--muted);margin:3px 0 0;max-width:80ch}.muted{color:var(--muted)}.small{font-size:13px}.r{text-align:right}.b{font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.between{justify-content:space-between;margin-top:6px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:7px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--hover)}.btn svg{width:15px;height:15px}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{filter:brightness(1.15)}
.btn.small{padding:5px 10px;font-size:13px}.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn[disabled]{opacity:.5;pointer-events:none}
.linkish{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}.linkish:hover{text-decoration:underline}
.link-strong{all:unset;cursor:pointer;font-weight:700}.link-strong:hover{text-decoration:underline}
.icon-btn{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}.icon-btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.neutral{background:var(--hover);color:var(--muted)}
.chip-btn{cursor:pointer}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{display:flex;gap:10px}.step b{display:block}.step span{color:var(--muted);font-size:13.5px}
.step-n{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700}
.table-wrap{overflow-x:auto}
table.ui{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.ui th,table.ui td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.ui th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600;white-space:nowrap}
table.ui th.r,table.ui td.r{text-align:right}
table.ui tbody tr:hover td{background:var(--hover)}
table.ui tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line)}
table.ui.compact td{padding:5px 8px}
table.ui td input,table.ui td select{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;font-size:14px}
table.ui td input:hover,table.ui td select:hover{border-color:var(--line)}
table.ui td input:focus,table.ui td select:focus{border-color:var(--primary);background:#fff;outline:none}
.numi{text-align:right;min-width:92px;font-variant-numeric:tabular-nums}.numi.s{min-width:48px}
.w-ledger{min-width:190px}.w-fs{min-width:170px}.w-cap{min-width:150px}.w-ppe{min-width:150px}
table.ui.tb td,table.ui.ppe td{padding:5px 5px}table.ui.tb td input,table.ui.tb td select,table.ui.ppe td input{font-size:13.5px;padding:4px 5px}
table.ui.tb th,table.ui.ppe th{padding:7px 6px}
tr.unmapped td{background:var(--warn-soft)}
td.empty{text-align:center;color:var(--muted);padding:26px!important}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.toolbar input,.toolbar select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:200px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.kpi small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.attach{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--warn);font-weight:600;font-size:13px;white-space:nowrap}
.attach:hover{text-decoration:underline}.attach svg{width:14px;height:14px}
.docs-cell{display:flex;align-items:center;gap:4px}
.doc-link{display:inline-flex;align-items:center;gap:5px;color:var(--primary);font-weight:600;font-size:13px;text-decoration:none;max-width:210px}
.doc-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-link:hover span{text-decoration:underline}.doc-link svg{width:14px;height:14px;flex:none}
.more{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--accent);padding:2px 6px;border-radius:5px;display:inline-grid;place-items:center}
.more svg{width:13px;height:13px}.more:hover{background:var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field.wide,.wide{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,.acc-body textarea,.pol textarea,.modal textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--primary);outline:none}
.static{padding:8px 10px;background:var(--surface-2);border-radius:7px;font-weight:700;font-variant-numeric:tabular-nums}
.section-title{grid-column:1/-1;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
.ck{display:flex;gap:8px;align-items:baseline;font-size:13.5px}.ck .dot{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px)}
.ck.ok .dot{background:var(--ok)}.ck.bad .dot{background:var(--bad)}.ck.warn .dot{background:var(--warn)}.ck.info .dot{background:var(--accent)}
.ck.bad{color:var(--bad);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap;margin-bottom:14px}
.tab{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.paper-wrap{background:#E6E9EE;border-radius:8px;padding:22px;overflow-x:auto}
.paper{background:#fff;color:#000;max-width:800px;min-width:640px;margin:0 auto;padding:56px 60px;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.paper hr.pb{border:0;border-top:2px dashed #b9c0cc;margin:40px -60px}
.amt-btn{all:unset;cursor:pointer;border-radius:3px;padding:0 3px;margin-right:-3px}.amt-btn:hover{background:#F4ECDC;outline:1px solid #D9C49A}
.acc{padding:0}.acc-head{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%;box-sizing:border-box;padding:14px 18px;font-weight:700}
.acc-head:hover{background:var(--hover)}.acc-body{padding:0 18px 18px}
.acc-body textarea{font-family:"Source Sans 3","Segoe UI",sans-serif;font-size:14.5px;line-height:1.5}
.pol{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.pol-head{display:flex;gap:8px}.pol-head input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-weight:700}.pol-head select{border:1px solid var(--line);border-radius:6px;padding:6px}
details.ph{margin-top:10px}details.ph summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.setup li{margin-bottom:6px}code{background:var(--surface-2);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.banner{border-radius:8px;padding:12px 14px;margin-top:14px;font-size:14px}.banner ul{margin:6px 0 0;padding-left:20px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}.banner.bad{background:var(--bad-soft);color:var(--bad)}
.dl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.dl{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.dl:hover{border-color:var(--primary);box-shadow:var(--shadow)}.dl svg{width:22px;height:22px;color:var(--accent)}.dl span{color:var(--muted);font-size:13px}
.dl[disabled]{opacity:.5}
.folder{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--primary);text-decoration:none;font-weight:600}.folder svg{width:15px;height:15px;color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,28,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(580px,100%);max-height:92vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal.wide{width:min(820px,100%)}.modal h2{margin:0}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.box{border:1px solid var(--line);border-radius:8px;padding:12px}
.doclist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.doclist li{display:flex;gap:8px;align-items:center}.doclist a{display:inline-flex;gap:6px;align-items:center;color:var(--primary);font-weight:600;text-decoration:none;flex:1}.doclist a svg{width:15px;height:15px}
.radio{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad)}
.checks-row td{font-weight:400!important;background:var(--surface)!important}
@media (max-width:980px){.app{grid-template-columns:1fr}nav.side{position:static;flex-direction:row;flex-wrap:wrap}.side-label{display:none}.side-client,.side-year{padding:6px}.steps,.dl-grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.form-grid.three{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.form-grid,.form-grid.three,.steps,.dl-grid{grid-template-columns:1fr}.paper{padding:28px 22px}}
@media print{body{background:#fff}.app>*:not(main){display:none}}
/* schedules */
.toolbar.panel{padding:10px 14px;border-radius:10px;border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff}
.check-lbl{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.check-lbl input{min-width:0!important;width:auto}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px -4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sec-title .muted{text-transform:none;letter-spacing:0;font-size:13px;font-weight:400}
.sched{border-left:3px solid var(--primary)}
.sched.unassigned{border-left-color:var(--warn)}
.sched-head{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sched.collapsed .sched-head{border-bottom:0}
.sched-toggle{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}
.sched-toggle:hover{background:var(--hover)}
.sched-title{flex:1;min-width:220px}
.sched-title b{font-size:15.5px;margin-right:8px}
.sched-title .chip{margin-right:6px;vertical-align:1px}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.sched-tot{text-align:right;min-width:92px}
.sched-tot small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sched-tot b{font-variant-numeric:tabular-nums;font-size:15px}
.icon-btn.gear:hover{background:var(--hover);color:var(--primary)}
.icon-btn.move:hover{background:var(--hover);color:var(--primary)}
.sched-foot{display:flex;gap:14px;align-items:center;padding:10px 14px;background:var(--surface-2);border-top:1px solid var(--line)}
td.acts{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip-add{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px dashed var(--line);border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chip-add:hover{border-color:var(--primary);background:var(--hover)}
.chip-add svg{width:13px;height:13px;color:var(--accent)}
.chip-add.new{border-style:solid;border-color:var(--primary);color:var(--primary)}
.modal .foot{align-items:center}

.sched-title[data-act]{cursor:pointer}
/* amounts & PPE matrix */
.numi.neg{color:var(--bad)}
.sign-hint{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;cursor:help;margin-left:3px}
table.matrix{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.matrix th,table.matrix td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.matrix thead th{background:var(--surface-2);font-size:12px;color:var(--muted)}
table.matrix thead th:first-child{min-width:280px}
table.matrix tbody th{font-weight:400;font-size:14px}
table.matrix td input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 6px;font-size:13.5px;min-width:110px}
table.matrix td input:focus,.m-name:focus{border-color:var(--primary);outline:none}
.m-name{width:100%;min-width:120px;border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-weight:700;color:var(--ink);background:var(--surface)}
table.matrix td.calc{color:var(--ink);background:var(--surface-2)}
table.matrix tr.msub th{font-weight:700;padding-top:10px;border-bottom:0;font-size:13.5px}
table.matrix tr.mband th{background:var(--primary);color:#fff;font-weight:700;letter-spacing:.03em;font-size:13px}
table.matrix tr.tot th,table.matrix tr.tot td{font-weight:700;border-top:1.5px solid var(--ink)}
table.matrix tr.grand th,table.matrix tr.grand td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:3px double var(--ink)}
table.matrix tr.mdocs td,table.matrix tr.mdel td{border-bottom:0}
.matrix-note{font-size:12.5px;color:var(--muted);margin:6px 14px 10px}
.sub-head{padding:10px 14px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:1px solid var(--line)}
.empty-block{padding:22px 16px;color:var(--muted);text-align:center}
table.matrix tbody th{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);background:transparent;white-space:nowrap}
table.matrix tr.msub th{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
table.matrix tr.mband th{background:var(--primary);color:#fff;text-transform:none}
/* single year header for all schedules */
.yearbar,.sched:not(.unassigned) .sched-head,.sec-title{display:grid;grid-template-columns:var(--sg-name) var(--sg-cy) var(--sg-py) var(--sg-doc) var(--sg-act);gap:0;align-items:center}
main{--sg-led:27%;--sg-cap:29%;--sg-name:56%;--sg-cy:14%;--sg-py:14%;--sg-doc:10%;--sg-act:6%}
.yearbar{grid-template-columns:var(--sg-led) var(--sg-cap) var(--sg-cy) var(--sg-py) var(--sg-doc) var(--sg-act);position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;border-radius:10px;border-left:3px solid var(--primary);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:9px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.yearbar>span{padding:0 11px}.yearbar .r{text-align:right}.yearbar .sign-hint{background:rgba(255,255,255,.2);color:#fff}
.sched:not(.unassigned) .sched-head{padding:10px 0;gap:0;flex-wrap:nowrap}
.sched-name{display:flex;align-items:flex-start;gap:8px;padding-left:10px;min-width:0}
.sched-name .sched-title{min-width:0}
.sched:not(.unassigned) .sched-tot{min-width:0;padding-right:11px}
.sched-proof{padding-left:11px;font-variant-numeric:tabular-nums}
.sched:not(.unassigned) .sched-head .gear{justify-self:center}
.sec-title{grid-template-columns:var(--sg-name) var(--sg-cy) 1fr;margin:8px 0 -4px;border-left:3px solid transparent}
.sec-title .sec-tot{text-align:right;padding-right:11px;color:var(--ink);letter-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
table.ui.tb.sch{table-layout:fixed;width:100%}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">FT</div><div><b>Fair Tax Audit Desk</b><span>Financial statements · Audit reports · Proof documents</span></div></div>
    <div class="top-right"><span id="saved">All changes saved</span><span id="drive-chip"></span></div>
  </header>
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<script>
/* ============================================================
   ENGINE – schedules (FS lines), calculations, checks
   ============================================================ */
const SECTIONS = [
  {key: 'nca', label: 'Non-current assets', dr: true},
  {key: 'ca',  label: 'Current assets', dr: true},
  {key: 'eq',  label: 'Equity', dr: false},
  {key: 'ncl', label: 'Non-current liabilities', dr: false},
  {key: 'cl',  label: 'Current liabilities', dr: false},
  {key: 'inc', label: 'Revenue & other income', dr: false},
  {key: 'dc',  label: 'Cost of revenue', dr: true},
  {key: 'exp', label: 'Expenses', dr: true}
];
const SECT = Object.fromEntries(SECTIONS.map(s => [s.key, s]));
const CATALOG = [
  {key:'ppe',  label:'Property, plant and equipment', sec:'nca', dr:true,  note:'PROPERTY, PLANT AND EQUIPMENT', folder:'05 Fixed Assets & Inventory', hint:'Fill the asset movement schedule (cost, additions, depreciation) – current and comparative year'},
  {key:'inv',  label:'Inventory', sec:'ca', dr:true, note:'INVENTORY', folder:'05 Fixed Assets & Inventory'},
  {key:'rec',  label:'Accounts and other receivables', sec:'ca', dr:true, note:'ACCOUNTS AND OTHER RECEIVABLES', folder:'04 Receivables & Payables'},
  {key:'rprec',label:'Due from related parties', sec:'ca', dr:true, note:'DUE FROM RELATED PARTIES', folder:'04 Receivables & Payables'},
  {key:'cash', label:'Cash and cash equivalents', sec:'ca', dr:true, note:'CASH AND CASH EQUIVALENTS', folder:'03 Bank & Loans'},
  {key:'cap',  label:'Share capital', sec:'eq', dr:false, note:'SHARE CAPITAL', folder:'01 Legal & Equity'},
  {key:'lr',   label:'Legal reserve', sec:'eq', dr:false, note:'LEGAL RESERVE', folder:'01 Legal & Equity', hint:'Opening balance – this year’s transfer is added automatically'},
  {key:'re',   label:'Retained earnings', sec:'eq', dr:false, note:'RETAINED EARNINGS', folder:'01 Legal & Equity', hint:'Opening balance (b/f) – profit for the year is added automatically'},
  {key:'div',  label:'Dividend paid', sec:'eq', dr:true, folder:'01 Legal & Equity', hint:'Deducted from retained earnings', noNote:true},
  {key:'ca',   label:'Shareholder’s current account', sec:'eq', dr:false, note:'SHAREHOLDER’S CURRENT ACCOUNT', folder:'01 Legal & Equity'},
  {key:'ltl',  label:'Long term loans', sec:'ncl', dr:false, note:'LONG TERM LOANS', folder:'03 Bank & Loans', hint:'Non-current portion only'},
  {key:'eosb', label:'Employees’ end of service benefits', sec:'ncl', dr:false, note:'EMPLOYEES’ END OF SERVICE BENEFITS', folder:'06 Payroll & EOSB'},
  {key:'pay',  label:'Accounts and other payables', sec:'cl', dr:false, note:'ACCOUNTS AND OTHER PAYABLES', folder:'04 Receivables & Payables', hint:'Corporate tax provision is added automatically'},
  {key:'rppay',label:'Due to related parties', sec:'cl', dr:false, note:'DUE TO RELATED PARTIES', folder:'04 Receivables & Payables'},
  {key:'stb',  label:'Short term borrowings', sec:'cl', dr:false, note:'SHORT TERM BORROWINGS', folder:'03 Bank & Loans', hint:'Including current portion of long term loans'},
  {key:'rev',  label:'Revenue', sec:'inc', dr:false, note:'REVENUE', folder:'07 Revenue & Expenses'},
  {key:'gain', label:'Gain on disposal of property, plant and equipment', sec:'inc', dr:false, note:'GAIN ON DISPOSAL OF PROPERTY, PLANT AND EQUIPMENT', folder:'05 Fixed Assets & Inventory'},
  {key:'oi',   label:'Other income', sec:'inc', dr:false, note:'OTHER INCOME', folder:'07 Revenue & Expenses'},
  {key:'cor',  label:'Cost of revenue', sec:'dc', dr:true, note:'COST OF REVENUE', folder:'07 Revenue & Expenses'},
  {key:'ga',   label:'General and administrative expenses', sec:'exp', dr:true, note:'GENERAL AND ADMINISTRATIVE EXPENSES', folder:'07 Revenue & Expenses'},
  {key:'sell', label:'Selling and distribution expenses', sec:'exp', dr:true, note:'SELLING AND DISTRIBUTION EXPENSES', folder:'07 Revenue & Expenses'},
  {key:'dep',  label:'Depreciation', sec:'exp', dr:true, folder:'05 Fixed Assets & Inventory', hint:'Taken from the PPE schedule unless you add ledger lines here', noNote:true},
  {key:'fin',  label:'Finance costs', sec:'exp', dr:true, note:'FINANCE COSTS', folder:'03 Bank & Loans'}
];
const CAT = Object.fromEntries(CATALOG.map(c => [c.key, c]));
const SUBFOLDERS = ['01 Legal & Equity','02 Trial Balance','03 Bank & Loans','04 Receivables & Payables','05 Fixed Assets & Inventory','06 Payroll & EOSB','07 Revenue & Expenses','08 Tax & VAT','09 Other'];

/* schedules live on each engagement so the user can rename them and add new ones */
function ensureSchedules(eng){
  if (!Array.isArray(eng.schedules)) eng.schedules = [];
  CATALOG.forEach(c => {
    const s = eng.schedules.find(x => x.key === c.key);
    if (!s) eng.schedules.push({key: c.key, label: c.label, note: c.note || '', folder: c.folder, showNote: !c.noNote});
  });
  eng.schedules.forEach(s => {
    const c = CAT[s.key];
    if (c){ s.sec = c.sec; s.dr = c.dr; s.builtin = true; s.hint = c.hint || ''; }
    else { s.custom = true; s.dr = SECT[s.sec] ? SECT[s.sec].dr : true; }
    if (s.showNote === undefined) s.showNote = true;
    if (!s.folder) s.folder = '09 Other';
  });
  return eng.schedules;
}
function SM(eng){ return Object.fromEntries(ensureSchedules(eng).map(s => [s.key, s])); }
function schedLabel(eng, key){ const s = SM(eng)[key]; return s ? s.label : key; }
function schedulesInOrder(eng){
  const list = ensureSchedules(eng);
  return SECTIONS.flatMap(sec => list.filter(s => s.sec === sec.key && s.builtin).sort((a, b) => CATALOG.findIndex(c => c.key === a.key) - CATALOG.findIndex(c => c.key === b.key))
    .concat(list.filter(s => s.sec === sec.key && s.custom)));
}

const AUTOMAP = [
  [/acc(umulated)?\.?\s*dep/i,'ppe'], [/opening (stock|inventor)|closing (stock|inventor)|purchase|direct (cost|exp|labour|material)|cost of (sales|revenue|goods)/i,'cor'],
  [/bank charge|interest|finance cost|loan charge/i,'fin'], [/depreciation/i,'dep'],
  [/vehicle|furniture|fixture|equipment|machinery|computer|building|plant|tools/i,'ppe'], [/inventor|stock/i,'inv'],
  [/due from|related part(y|ies).*rec/i,'rprec'], [/due to|related part(y|ies).*pay/i,'rppay'],
  [/receivable|debtor|prepaid|prepayment|deposit|advance to/i,'rec'], [/bank|cash|petty/i,'cash'],
  [/share capital|^capital/i,'cap'], [/legal reserve|statutory reserve/i,'lr'], [/retained|accumulated profit|profit (and|&) loss/i,'re'],
  [/dividend|drawing/i,'div'], [/current account|shareholder/i,'ca'], [/overdraft|short.?term|current portion/i,'stb'], [/loan/i,'ltl'],
  [/gratuity|end of service|eosb/i,'eosb'], [/payable|creditor|accrued|accrual|vat|provision|advance from/i,'pay'],
  [/gain on/i,'gain'], [/other income|misc.*income|sundry income/i,'oi'], [/sales|revenue|turnover|income from|service income|contract income/i,'rev'],
  [/advertis|marketing|commission|selling|distribution|delivery/i,'sell'],
  [/salar|wage|rent|utilit|telephone|communication|visa|licen|professional|audit|insurance|repair|maintenance|toll|fuel|office|general|admin|travel|printing|stationery|expense/i,'ga']
];
function autoMap(ledger, eng){
  if (eng){ // exact match on a custom schedule name first
    const hit = ensureSchedules(eng).find(s => s.custom && s.label && (ledger || '').toLowerCase().includes(s.label.toLowerCase()));
    if (hit) return hit.key;
  }
  for (const [re, k] of AUTOMAP) if (re.test(ledger || '')) return k; return '';
}

const R = v => Math.round(+v || 0);
/* amounts are signed by the schedule's own nature: + agrees with the schedule, − is against it */
function natural(line, eng){ const c = eng ? SM(eng)[line.fs] : CAT[line.fs]; if (!c) return 0; return R(line.amt); }
function isDrNature(eng, key){ const c = SM(eng)[key]; return c ? !!c.dr : true; } // lines not in a schedule are treated as debit
/* when a line changes schedule, keep its accounting effect: flip the sign if the nature changes */
function moveLine(eng, line, newKey){ if (isDrNature(eng, line.fs) !== isDrNature(eng, newKey)){ line.amt = -R(line.amt); line.py = -R(line.py); } line.fs = newKey; }
/* older data stored debit / credit – convert once */
function migrateLines(eng){
  (eng.tb || []).forEach(l => {
    if (l.amt === undefined){ const d = R(l.dr), c = R(l.cr); l.amt = isDrNature(eng, l.fs) ? d - c : c - d; delete l.dr; delete l.cr; }
  });
  // comparative PPE is kept as totals in written-down-value form
  if (!eng.ppePy){
    const ps = eng.ppe || [];
    eng.ppePy = {add: ps.reduce((a, p) => a + R(p.pyAdd), 0), disp: ps.reduce((a, p) => a + R(p.pyDisp) - R(p.pyDepDisp), 0), charge: ps.reduce((a, p) => a + R(p.pyCharge), 0)};
  }
  (eng.ppe || []).forEach(p => { delete p.pyAdd; delete p.pyDisp; delete p.pyCharge; delete p.pyDepDisp; });
}
function ppeRows(eng){
  return (eng.ppe || []).map(p => {
    const o = {...p}; ['costOpen','add','disp','depOpen','charge','depDisp'].forEach(k => o[k] = R(p[k]));
    o.costClose = o.costOpen + o.add - o.disp; o.depClose = o.depOpen + o.charge - o.depDisp;
    o.nbv = o.costClose - o.depClose; o.nbvPy = o.costOpen - o.depOpen; o.dispWdv = o.disp - o.depDisp;
    return o;
  });
}
const PPE_KEYS = ['costOpen','add','disp','costClose','depOpen','charge','depDisp','depClose','nbv','nbvPy','dispWdv'];

function subLines(eng, key){
  const out = []; const idx = {};
  const m = SM(eng);
  eng.tb.filter(l => l.fs === key).forEach(l => {
    const cap = (l.caption || l.ledger || '').trim() || (m[key] ? m[key].label : key);
    if (idx[cap] === undefined){ idx[cap] = out.length; out.push({caption: cap, cy: 0, py: 0, lines: []}); }
    const o = out[idx[cap]]; o.cy += natural(l, eng); o.py += R(l.py); o.lines.push(l);
  });
  return out;
}

/* equity modes: first year from the settings or the date established; reserve ledger lines as opening or closing balances */
function engClient(en){ return (typeof DB !== 'undefined' && DB && (DB.clients || []).find(c => (c.engagements || []).includes(en))) || null; }
function estYearOf(en){ const c = engClient(en), m = String((c && c.profile && c.profile.estDate) || '').match(/\b(19|20)\d{2}\b/g); return m ? +m[m.length - 1] : null; }
function eqModes(eng, cy, py){
  const PYI = eng.pyInfo || {}, S = eng.settings || {}, tol = 10;
  const estYear = estYearOf(eng), firstMode = PYI.firstYear || 'auto';
  const firstPy = firstMode === 'yes' || (firstMode === 'auto' && estYear === eng.year - 1);
  // reserve balances in the prior year column: only then can this year's lines be told apart as opening or closing
  const hasPy = R(py.re) !== 0 || R(py.lr) !== 0;
  const tbMode = S.eqTb || 'auto';
  const pick = (tbv, pyClose) => tbMode === 'open' || tbMode === 'close' ? tbMode : (!hasPy || Math.abs(tbv - pyClose) <= tol ? 'open' : 'close');
  return {estYear, firstMode, firstPy, hasPy, tbMode, lr: pick(cy.lr, py.lr), re: pick(cy.re, py.re)};
}
function eqModeFields(en, r, pre){
  const Y = en.year, PY = Y - 1, E = (r.cy && r.cy.eqModes) || {}, c = engClient(en), est = c && c.profile && c.profile.estDate;
  const autoFirst = E.estYear !== null && E.estYear !== undefined ? `Auto – established ${est} → ${E.estYear === PY ? 'yes' : 'no'}` : 'Auto – no date established in the company profile → no';
  const word = m => m === 'close' ? 'closing' : 'opening';
  const autoTb = 'Auto – ' + (E.re === E.lr ? `${word(E.re)} balances found` : `retained earnings ${word(E.re)}, legal reserve ${word(E.lr)}`);
  return field(pre + '-first', `Was FY${PY} the company’s first year?`, en.pyInfo.firstYear || 'auto', {bind: 'eng.pyInfo.firstYear', select: [['auto', autoFirst], ['yes', `Yes – company started in FY${PY}`], ['no', `No – work back FY${PY} openings`]]})
    + field(pre + '-eqtb', `FY${Y} retained earnings and legal reserve lines hold`, en.settings.eqTb || 'auto', {bind: 'eng.settings.eqTb', select: [['auto', autoTb], ['open', `Opening balances (before FY${Y} profit)`], ['close', `Closing balances (after FY${Y} profit and transfer)`]]});
}
function eqDiffLabel(v){ return Math.abs(v) <= 10 ? 'Rounding difference' : 'Other movements (difference – check)'; }

function ctFor(pbt, adj){ return Math.round(Math.max(0, pbt + (adj || 0) - 375000) * 0.09); }

function compute(eng, prevEng){
  const S = eng.settings, PYI = eng.pyInfo;
  const scheds = ensureSchedules(eng), m = SM(eng);
  const cy = {}, py = {};
  scheds.forEach(s => { cy[s.key] = 0; py[s.key] = 0; });
  let dr = 0, cr = 0, unmapped = 0, docsCount = 0;
  const lineCount = {};
  eng.tb.forEach(l => {
    if (l.docs && l.docs.length) docsCount++;
    if (isDrNature(eng, l.fs)) dr += R(l.amt); else cr += R(l.amt);
    if (!m[l.fs]){ unmapped++; return; }
    cy[l.fs] += R(l.amt); py[l.fs] += R(l.py); lineCount[l.fs] = (lineCount[l.fs] || 0) + 1;
  });
  // PPE movement schedule (asset classes) drives the PPE figure and, when no ledger lines exist, depreciation
  const ppe = ppeRows(eng);
  const ppeT = PPE_KEYS.reduce((a, k) => (a[k] = ppe.reduce((s2, p) => s2 + p[k], 0), a), {});
  const PP = eng.ppePy || {};
  ppeT.pyAdd = R(PP.add); ppeT.pyDispWdv = R(PP.disp); ppeT.pyCharge = R(PP.charge);
  ppeT.nbvPyOpenAuto = ppeT.nbvPy - ppeT.pyAdd + ppeT.pyDispWdv + ppeT.pyCharge;
  ppeT.pyOpenTyped = PP.open !== undefined && PP.open !== null && PP.open !== '';
  ppeT.nbvPyOpen = ppeT.pyOpenTyped ? R(PP.open) : ppeT.nbvPyOpenAuto;
  ppeT.pyCloseCalc = ppeT.nbvPyOpen + ppeT.pyAdd - ppeT.pyDispWdv - ppeT.pyCharge;
  ppeT.pyDiff = ppeT.pyCloseCalc - ppeT.nbvPy;
  const ppeLines = {cy: cy.ppe, py: py.ppe, n: lineCount.ppe || 0}, depLines = {cy: cy.dep, py: py.dep, n: lineCount.dep || 0};
  if (ppe.length){
    if (!ppeLines.n) dr += ppeT.nbv;
    cy.ppe = ppeT.nbv; py.ppe = ppeT.nbvPy;
    if (!depLines.n){ dr += ppeT.charge; cy.dep = ppeT.charge; py.dep = ppeT.pyCharge; }
  }
  const custom = sec => scheds.filter(s => s.custom && s.sec === sec);
  for (const b of [cy, py]){
    ['nca', 'ca', 'eq', 'ncl', 'cl', 'inc', 'dc', 'exp'].forEach(sec => { b['x' + sec] = custom(sec).reduce((a, s) => a + b[s.key], 0); });
    b.gp = b.rev - b.cor - b.xdc;
    b.pbt = b.gp - b.ga - b.sell - b.dep - b.fin - b.xexp + b.gain + b.oi + b.xinc;
  }
  cy.ctAdj = R(S.ctAdjust);
  cy.ct = S.ctMode === 'manual' ? R(S.ctAmount) : ctFor(cy.pbt, cy.ctAdj);
  py.ctAdj = R(PYI.ctAdjust);
  py.ct = PYI.ctMode === 'manual' ? R(PYI.ctAmount) : ctFor(py.pbt, py.ctAdj);
  cy.pat = cy.pbt - cy.ct; py.pat = py.pbt - py.ct;
  const eqIt = (yr, col) => (eng.soceItems || []).filter(x => x.yr === yr).reduce((a, x) => a + R(x[col]), 0);
  ['cap', 'lr', 're', 'ca', 'oth'].forEach(col => { cy[col + 'Items'] = eqIt('cy', col); py[col + 'Items'] = eqIt('py', col); });
  // equity: is the prior year the company's first year, and are this year's reserve lines opening or closing balances?
  const EQ = eqModes(eng, cy, py);
  const firstPy = EQ.firstPy;
  // prior year – closing balances come from the ledger; a first year starts from nothing, otherwise openings are worked back
  py.lrClose = py.lr;
  if (firstPy){ py.lrOpen = 0; py.lrTransfer = py.lrClose - py.lrItems; }
  else { py.lrTransfer = R(PYI.lrTransfer); py.lrOpen = py.lrClose - py.lrTransfer - py.lrItems; }
  py.reClose = py.re;
  if (firstPy){ py.reOpen = 0; py.reAdj = py.reClose - (py.pat - py.div - py.lrTransfer + py.reItems); }
  else { py.reOpen = py.reClose - py.pat + py.div + py.lrTransfer - py.reItems; py.reAdj = 0; }
  py.capOpen = firstPy ? 0 : py.cap - py.capItems; py.capIntro = py.cap - py.capOpen - py.capItems;
  py.caClose = py.ca; py.caOpen = firstPy ? 0 : R(PYI.caOpen); py.caMove = py.caClose - py.caOpen;
  py.othOpen = firstPy ? 0 : py.xeq - py.othItems; py.othMove = py.xeq - py.othOpen - py.othItems;
  // current year – opening balances are last year's closing balances
  const lrIsClose = EQ.lr === 'close', reIsClose = EQ.re === 'close';
  if (lrIsClose){ cy.lrClose = cy.lr; cy.lrOpen = py.lrClose; cy.lrTransfer = cy.lrClose - cy.lrOpen - cy.lrItems; }
  else { cy.lrOpen = cy.lr; cy.lrTransfer = R(S.lrTransfer); cy.lrClose = cy.lrOpen + cy.lrTransfer + cy.lrItems; }
  cy.lrSuggest = Math.max(0, Math.min(Math.round(cy.pat * 0.05), Math.round(cy.cap * 0.5) - cy.lrOpen));
  if (reIsClose){ cy.reClose = cy.re; cy.reOpen = py.reClose; cy.reAdj = cy.reClose - (cy.reOpen + cy.pat - cy.div - cy.lrTransfer + cy.reItems); }
  else { cy.reOpen = cy.re; cy.reClose = cy.reOpen + cy.pat - cy.div - cy.lrTransfer + cy.reItems; cy.reAdj = 0; }
  cy.lrOpenDiff = EQ.hasPy ? cy.lrOpen - py.lrClose : 0; cy.reOpenDiff = EQ.hasPy ? cy.reOpen - py.reClose : 0;
  cy.capOpen = py.cap; cy.capIntro = cy.cap - py.cap - cy.capItems;
  cy.caOpen = py.ca; cy.caClose = cy.ca; cy.caMove = cy.caClose - cy.caOpen;
  cy.othOpen = py.xeq; cy.othMove = cy.xeq - py.xeq - cy.othItems;
  cy.eqModes = EQ;
  // a trial balance holding closing reserves also still holds this year's profit – take the difference out for the balance check
  const eqTbAdj = (lrIsClose ? cy.lr - cy.lrOpen : 0) + (reIsClose ? cy.re - cy.reOpen : 0);
  for (const b of [cy, py]){
    b.payTot = b.pay + b.ct;
    b.nca = b.ppe + b.xnca; b.caTot = b.inv + b.rec + b.rprec + b.cash + b.xca; b.ta = b.nca + b.caTot;
    b.eq = b.cap + b.lrClose + b.reClose + b.caClose + b.xeq;
    b.ncl = b.ltl + b.eosb + b.xncl; b.cl = b.payTot + b.rppay + b.stb + b.xcl; b.tl = b.ncl + b.cl; b.tel = b.eq + b.tl;
  }
  // cash flow – current year
  const cf = {custom: {}};
  cf.pat = cy.pat; cf.dep = cy.dep; cf.gain = -cy.gain; cf.eosb = cy.eosb - py.eosb;
  cf.opBefore = cf.pat + cf.dep + cf.gain + cf.eosb;
  cf.inv = py.inv - cy.inv; cf.rec = py.rec - cy.rec; cf.rprec = py.rprec - cy.rprec;
  cf.pay = cy.payTot - py.payTot; cf.rppay = cy.rppay - py.rppay;
  scheds.filter(s => s.custom).forEach(s => { cf.custom[s.key] = ['ca', 'nca'].includes(s.sec) ? py[s.key] - cy[s.key] : ['cl', 'ncl', 'eq'].includes(s.sec) ? cy[s.key] - py[s.key] : 0; });
  const cSum = secs => scheds.filter(s => s.custom && secs.includes(s.sec)).reduce((a, s) => a + cf.custom[s.key], 0);
  cf.op = cf.opBefore + cf.inv + cf.rec + cf.rprec + cf.pay + cf.rppay + cSum(['ca', 'cl']);
  cf.additions = ppe.length ? -ppeT.add : -R(S.ppeAdditions); cf.proceeds = R(S.disposalProceeds);
  cf.invTot = cf.additions + cf.proceeds + cSum(['nca']);
  cf.loans = (cy.ltl + cy.stb) - (py.ltl + py.stb); cf.ca = cy.caMove; cf.div = -cy.div; cf.shareCap = cy.cap - py.cap;
  cf.finTot = cf.loans + cf.ca + cf.div + cSum(['ncl', 'eq']);
  cf.net = cf.op + cf.invTot + cf.finTot; cf.open = py.cash; cf.close = cf.open + cf.net; cf.diff = cf.close - cy.cash;
  // cash flow – prior year
  let cfp;
  if (prevEng){ cfp = compute(prevEng, null).cf; }
  else {
    const mm = PYI.cf || {}; cfp = {custom: {}};
    cfp.pat = py.pat; cfp.dep = py.dep; cfp.gain = -py.gain; cfp.eosb = R(mm.eosb);
    cfp.opBefore = cfp.pat + cfp.dep + cfp.gain + cfp.eosb;
    cfp.inv = R(mm.inv); cfp.rec = R(mm.rec); cfp.rprec = R(mm.rprec); cfp.pay = R(mm.pay); cfp.rppay = R(mm.rppay); cfp.otherOp = R(mm.otherOp);
    cfp.op = cfp.opBefore + cfp.inv + cfp.rec + cfp.rprec + cfp.pay + cfp.rppay + cfp.otherOp;
    cfp.additions = ppe.length ? -ppeT.pyAdd : R(mm.additions); cfp.proceeds = R(mm.proceeds); cfp.otherInv = R(mm.otherInv); cfp.invTot = cfp.additions + cfp.proceeds + cfp.otherInv;
    cfp.loans = R(mm.loans); cfp.ca = py.caMove; cfp.div = -py.div; cfp.shareCap = py.cap - py.capOpen; cfp.otherFin = R(mm.otherFin); cfp.finTot = cfp.loans + cfp.ca + cfp.div + cfp.otherFin;
    cfp.net = cfp.op + cfp.invTot + cfp.finTot; cfp.open = R(mm.openCash); cfp.close = cfp.open + cfp.net; cfp.diff = cfp.close - py.cash;
  }
  cfp = applyCfLayout(eng, cf, cfp, cy, py);
  const checks = [];
  const add = (ok, text, level) => checks.push({ok, text, level: ok ? 'ok' : (level || 'bad')});
  { const crT = cr - eqTbAdj, note = eqTbAdj ? ' (reserves taken as closing balances)' : ''; add(dr === crT, dr === crT ? 'Trial balance balances' + note : `Trial balance is out by ${fmtN(dr - crT)}${note}`); }
  add(unmapped === 0, unmapped ? `${unmapped} ledger line(s) not in any schedule` : 'All ledger lines are in schedules');
  add(cy.ta === cy.tel, cy.ta === cy.tel ? `Statement of financial position ${eng.year} agrees` : `Statement of financial position ${eng.year} out by ${fmtN(cy.ta - cy.tel)}`);
  add(py.ta === py.tel, py.ta === py.tel ? `Statement of financial position ${eng.year-1} agrees` : `Prior year (${eng.year-1}) figures out by ${fmtN(py.ta - py.tel)}`);
  if (ppe.length){
    if (ppeLines.n){
      add(ppeLines.cy === ppeT.nbv, ppeLines.cy === ppeT.nbv ? 'PPE ledger lines agree with PPE schedule' : `PPE ledger lines differ from PPE schedule by ${fmtN(ppeLines.cy - ppeT.nbv)}`);
      add(ppeLines.py === ppeT.nbvPy, ppeLines.py === ppeT.nbvPy ? 'PPE prior year agrees with PPE schedule' : `PPE prior year ledger figure differs from schedule by ${fmtN(ppeLines.py - ppeT.nbvPy)}`);
    }
    if (depLines.n){
      add(depLines.cy === ppeT.charge, depLines.cy === ppeT.charge ? 'Depreciation agrees with PPE schedule' : `Depreciation differs from PPE schedule by ${fmtN(depLines.cy - ppeT.charge)}`);
      add(depLines.py === ppeT.pyCharge, depLines.py === ppeT.pyCharge ? 'Prior year depreciation agrees with PPE schedule' : `Prior year depreciation differs from PPE schedule by ${fmtN(depLines.py - ppeT.pyCharge)}`, 'warn');
    }
    if (ppeT.pyDiff) { const n0 = v => Math.round(v || 0).toLocaleString('en-US'); add(false, `PPE comparative ${eng.year - 1} does not add up: opening ${n0(ppeT.nbvPyOpen)} + additions ${n0(ppeT.pyAdd)} − disposals ${n0(ppeT.pyDispWdv)} − depreciation ${n0(ppeT.pyCharge)} = ${n0(ppeT.pyCloseCalc)}, but the ${eng.year} opening balances give ${n0(ppeT.nbvPy)} – difference ${n0(ppeT.pyDiff)}`); }
    if (!ppeT.pyOpenTyped && ppeT.nbvPyOpen < 0) add(false, `Comparative PPE opening written down value is negative (${fmtN(ppeT.nbvPyOpen)}) – check prior year additions and depreciation`, 'warn');
  }
  add(cf.diff === 0, cf.diff === 0 ? `Cash flow ${eng.year} reconciles to cash balance` : `Cash flow ${eng.year} does not reconcile – difference ${fmtN(cf.diff)}`);
  add(cfp.diff === 0, cfp.diff === 0 ? `Cash flow ${eng.year-1} reconciles` : `Prior year cash flow does not reconcile – difference ${fmtN(cfp.diff)} (enter prior year cash flow figures)`, 'warn');
  if (cy.lrClose < cy.cap * 0.5 && cy.pat > 0 && cy.lrTransfer === 0) add(false, `Legal reserve below 50% of capital – suggested transfer ${fmtN(cy.lrSuggest)}`, 'warn');
  { const Y0 = eng.year, P0 = eng.year - 1;
    if (py.reAdj) add(false, `Retained earnings at the end of FY${P0} (${fmtN(py.reClose)}) differ from the FY${P0} profit less transfers (${fmtN(py.reClose - py.reAdj)}) by ${fmtN(py.reAdj)} – shown as ${Math.abs(py.reAdj) <= 10 ? 'a rounding difference' : 'a difference'} in changes in equity`, 'warn');
    if (cy.reAdj) add(false, `Retained earnings at the end of FY${Y0} (${fmtN(cy.reClose)}) differ from FY${P0} closing + profit − dividend − transfer (${fmtN(cy.reClose - cy.reAdj)}) by ${fmtN(cy.reAdj)}`, 'warn');
    if (cy.reOpenDiff) add(false, `Retained earnings at the start of FY${Y0} (${fmtN(cy.reOpen)}) differ from the FY${P0} closing balance (${fmtN(py.reClose)}) by ${fmtN(cy.reOpenDiff)} – if the FY${Y0} ledger shows the closing balance, choose “Closing balances” for the FY${Y0} retained earnings and legal reserve lines`, 'warn');
    if (cy.lrOpenDiff) add(false, `Legal reserve at the start of FY${Y0} (${fmtN(cy.lrOpen)}) differs from the FY${P0} closing balance (${fmtN(py.lrClose)}) by ${fmtN(cy.lrOpenDiff)}`, 'warn');
    if (!firstPy && EQ.firstMode === 'auto' && EQ.estYear === null && EQ.hasPy && py.reOpen < 0) add(false, `Retained earnings at the start of FY${P0} work back to ${fmtN(py.reOpen)} – if FY${P0} was the company’s first year, answer “Yes” to “Was FY${P0} the company’s first year?” (click any equity amount in the statements) or enter the date established in the company profile`, 'warn');
  }
  if (eng.tb.length) add(docsCount === eng.tb.length, `${docsCount} of ${eng.tb.length} ledger lines have supporting documents`, 'info');
  return {cy, py, dr, cr, unmapped, docsCount, ppe, ppeT, cf, cfp, checks};
}

function fmtN(v){ v = Math.round(v || 0); if (v === 0) return '-'; const s = Math.abs(v).toLocaleString('en-US'); return v < 0 ? `(${s})` : s; }

function newEngagement(year, type){
  const e = {
    id: uid(), year: +year, type: type || 'Audit', tb: [], ppe: [], ppePy: {add: 0, disp: 0, charge: 0}, schedules: [],
    settings: {ctMode:'auto', ctAdjust:0, ctAmount:0, lrTransfer:0, disposalProceeds:0, ppeAdditions:0, deprMethod:'straight-line', draft:true},
    pyInfo: {ctMode:'auto', ctAdjust:0, ctAmount:0, lrTransfer:0, caOpen:0, cf:{inv:0,rec:0,rprec:0,pay:0,rppay:0,eosb:0,otherOp:0,additions:0,proceeds:0,otherInv:0,loans:0,otherFin:0,openCash:0}},
    texts: JSON.parse(JSON.stringify(DEFAULT_TEXTS)), customNotes: []
  };
  ensureSchedules(e);
  return e;
}
function rollForward(client, eng){
  const n = newEngagement(eng.year + 1, eng.type);
  const r = compute(eng, prevOf(client, eng));
  n.texts = JSON.parse(JSON.stringify(eng.texts)); n.customNotes = JSON.parse(JSON.stringify(eng.customNotes || []));
  n.settings.deprMethod = eng.settings.deprMethod;
  n.schedules = JSON.parse(JSON.stringify(ensureSchedules(eng))); ensureSchedules(n);
  const incomeOrExpense = s => ['inc', 'dc', 'exp'].includes(s.sec);
  const m = SM(eng);
  n.tb = eng.tb.map(l => {
    let py = natural(l, eng);
    if (l.fs === 're') py = r.cy.reClose; if (l.fs === 'lr') py = r.cy.lrClose;
    return {id: uid(), ledger: l.ledger, fs: l.fs, caption: l.caption, amt: 0, py, docs: []};
  });
  n.pyInfo.caOpen = r.cy.caOpen; n.pyInfo.lrTransfer = r.cy.lrTransfer; n.pyInfo.ctMode = 'manual'; n.pyInfo.ctAmount = r.cy.ct;
  n.pyInfo.cf = {};
  n.ppe = r.ppe.map(p => ({id: uid(), name: p.name, life: p.life, costOpen: p.costClose, add: 0, disp: 0, depOpen: p.depClose, charge: 0, depDisp: 0, docs: []}));
  n.ppePy = {add: r.ppeT.add, disp: r.ppeT.dispWdv, charge: r.ppeT.charge};
  n.layout = JSON.parse(JSON.stringify(layoutOf(eng)));
  if (eng.cfLayout) n.cfLayout = JSON.parse(JSON.stringify(eng.cfLayout));
  return n;
}
function prevOf(client, eng){ return (client.engagements || []).find(e => e.year === eng.year - 1) || null; }
function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

/* ---------- report layout: section order, index, page numbers, note order, page setup ---------- */
const SECTION_DEFS = [
  {id: 'ar', title: 'Independent auditor’s report', audit: true},
  {id: 'ci', title: 'Company information'},
  {id: 'mr', title: 'Management report'},
  {id: 'sofp', title: 'Statement of financial position'},
  {id: 'soci', title: 'Statement of profit or loss and other comprehensive income'},
  {id: 'soce', title: 'Statement of changes in equity'},
  {id: 'socf', title: 'Statement of cash flows'},
  {id: 'pol', title: 'Material accounting policies'},
  {id: 'notes', title: 'Notes to the financial statements'}
];
const PAGE_SIZES = {A4: [595.28, 841.89], Letter: [612, 792], Legal: [612, 1008]};
// all distances in millimetres
// top / bottom = blank space kept for the letterhead's printed header and footer on EVERY page;
// the page number line sits just above the bottom margin, the optional header text just below the top margin
const PAGE_DEFAULT = {v: 2, size: 'A4', top: 20, bottom: 12, left: 23, right: 20, letterhead: 0,
  headerText: '', numPos: 'bottom-center', numFormat: 'n', numStart: 1, lhImage: '', lhShow: 'body', lhInPdf: false};
function mergeOrder(saved, defaults){
  const res = (saved || []).filter((k, i, a) => defaults.includes(k) && a.indexOf(k) === i);
  defaults.forEach((k, i) => {
    if (res.includes(k)) return;
    let pos = 0;

/* markup -> blocks */
function parseMarkup(text){
  const blocks = []; let para = null, list = null;
  const flush = () => { if (para){ blocks.push({t:'p', text: para.join('\n')}); para = null; } if (list){ blocks.push(list); list = null; } };
  String(text || '').split('\n').forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()){ flush(); return; }
    let m;
    if ((m = line.match(/^\[\[(\w+)\]\]$/))){ flush(); blocks.push({t:'token', name: m[1]}); return; }
    if ((m = line.match(/^##\s+(.*)$/))){ flush(); blocks.push({t:'h', text: m[1]}); return; }
    if ((m = line.match(/^-\s+(.*)$/))){ if (para){ blocks.push({t:'p', text: para.join('\n')}); para = null; } if (!list || list.t !== 'ul'){ if (list) blocks.push(list); list = {t:'ul', items:[]}; } list.items.push(m[1]); return; }
    if ((m = line.match(/^\d+[.)]\s+(.*)$/))){ if (para){ blocks.push({t:'p', text: para.join('\n')}); para = null; } if (!list || list.t !== 'ol'){ if (list) blocks.push(list); list = {t:'ol', items:[]}; } list.items.push(m[1]); return; }
    if (list){ blocks.push(list); list = null; }
    (para = para || []).push(line);
  });
  flush();
  return blocks;
}

}

async function fontsAvailable(){
  try { const r = await fetch(PDF_FONTS.Carlito.normal, {method: 'GET', cache: 'force-cache'}); return r.ok; } catch (e) { return false; }
}
async function pdfFontSet(){
  const useCarlito = await fontsAvailable();
  const roboto = {normal: 'Roboto-Regular.ttf', bold: 'Roboto-Medium.ttf', italics: 'Roboto-Italic.ttf', bolditalics: 'Roboto-MediumItalic.ttf'};
  return {useCarlito, fonts: useCarlito ? Object.assign({Roboto: roboto}, PDF_FONTS) : {Roboto: roboto}};
}
function renderDef(def, F, withBytes){
  if (!F.useCarlito) def.defaultStyle.font = 'Roboto';
  return new Promise(res => pdfMake.createPdf(def, null, F.fonts).getBuffer(b => res(withBytes ? new Uint8Array(b) : null)));
}
/* height of the running notes heading, measured once */
async function measureHead(M, F){
  const G = pageGeometry(M), s = M.sections.find(x => x.kind === 'notes');
  if (!s) return {y: 0, n: 0};
  const h = {};
  for (const [k, years] of [['y', s.years || [M.eng.year, M.eng.year - 1]], ['n', null]]){
    const pos = {};
    const def = {pageSize: {width: G.pw, height: G.ph}, pageMargins: [G.left, 40, G.right, 40], defaultStyle: {font: 'Carlito', fontSize: 11, lineHeight: 1.12},
      content: [{text: ' ', fontSize: 1, lineHeight: 1, id: 'a'}, pdfHead(s.head, years, G.W), {text: ' ', fontSize: 1, lineHeight: 1, id: 'b'}],
      pageBreakBefore: (node) => { if (node.id && node.startPosition) pos[node.id] = node.startPosition.top; return false; }};
    await renderDef(def, F);
    h[k] = Math.ceil((pos.b || 110) - (pos.a || 0));
  }
  return h;
}
/* layout pass for one part: number of pages; statements are squeezed until they fit on one page */
async function passPart(M, part, F, headH){
  const G = pageGeometry(M);
  const run = async (v) => {
    const info = {total: 1, pos: {}};
    const def = pdfPartDef(M, part, {v, headH, onTotal: t => { info.total = t; }, onNode: n => { if (n.id && n.startPosition && !info.pos[n.id]) info.pos[n.id] = n.startPosition; }});
    await renderDef(def, F);
    return info;
  };
  let v = 1, info;
  if (part.kind === 'notes'){
    const sig = pos => Object.keys(pos).filter(k => /^t\d+$/.test(k)).sort().map(k => k + '@' + pos[k].pageNumber).join(',');
    part.tpos = null; part.tblPages = null;
    info = await run(v);
    for (let round = 0; round < 3; round++){
      const before = sig(part.tpos || {}), now = sig(info.pos);
      if (round > 0 && before === now) break;
      part.tpos = info.pos;
      const offTables = Object.keys(info.pos).some(k => /^t\d+$/.test(k) && notesYearsOff(M.layout, Object.assign({}, part, {tblPages: null}), info.pos[k].pageNumber) && (M.layout.notesYears === 'custom'));
      if (!offTables) break;
      info = await run(v);
    }
    part.tblPages = [...new Set(Object.keys(part.tpos || {}).filter(k => /^t\d+$/.test(k)).map(k => part.tpos[k].pageNumber))];
    part.pages = info.total; part.v = v;
    return;
  }
  info = await run(v);
  if (part.kind === 'statement'){
    for (let round = 0; round < 6 && info.total > 1; round++){
      const end = info.pos.end || {pageNumber: info.total, top: G.ph - G.bottom};
      const used = (end.pageNumber - 1) * G.H + Math.max(0, end.top - G.top) + 12;
      v = Math.max(0.3, Math.min(v - 0.05, v * (G.H / used) * (1 - 0.03 * round)));
      info = await run(v);
      if (v <= 0.3) break;
    }
  }
  part.pages = info.total; part.v = v;
}
async function pdfLayout(M, F){
  const headH = await measureHead(M, F);
  const parts = pdfParts(M);
  for (const pt of parts) await passPart(M, pt, F, headH);
  const num = pdfNumbering(M, parts);
  return {parts, num, headH};
}
async function pdfPageNumbers(M){
  const F = await pdfFontSet();
  return (await pdfLayout(M, F)).num;
}
async function pdfLib(){
  if (!window.PDFLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
  return window.PDFLib;
}
async function joinPdfs(list, title){
  if (list.length === 1) return list[0];
  const {PDFDocument} = await pdfLib();
  const out = await PDFDocument.create();
  for (const bytes of list){
    const d = await PDFDocument.load(bytes);
    (await out.copyPages(d, d.getPageIndices())).forEach(pg => out.addPage(pg));
  }
  out.setTitle(title); out.setAuthor('Fair Tax Audit Desk'); out.setCreator('Fair Tax Audit Desk'); out.setProducer('Fair Tax Audit Desk');
  return await out.save();
}
/* opts.only = section ids to print (page numbers stay as in the full report); opts.letterhead = show letterhead picture */
async function makePdf(M, opts){
  opts = opts || {};
  const F = await pdfFontSet();
  const {parts, num, headH} = await pdfLayout(M, F);
  const chosen = opts.only ? parts.filter(pt => opts.only.includes(pt.sid) || (pt.kind === 'cover' && opts.only.includes('cover')) || (pt.kind === 'index' && opts.only.includes('index'))) : parts;
  const pieces = [];
  for (const pt of chosen) pieces.push(await renderDef(pdfPartDef(M, pt, {v: pt.v, headH, num, letterhead: !!opts.letterhead}), F, true));
  const bytes = await joinPdfs(pieces, `${M.client.name} – Financial statements ${M.eng.year}`);
  const sheets = [];
  chosen.forEach(pt => { for (let cur = 1; cur <= (pt.pages || 1); cur++){ const yrs = pt.kind === 'notes' && pt.s.years && !pt.chunk.some(it => it.noYears); sheets.push({key: pt.key, cur, notes: !!yrs, off: yrs ? notesYearsOff(M.layout, pt, cur) : false, tbl: (pt.tblPages || []).includes(cur), years: pt.s.years}); } });
  return {num, bytes, sheets,
    getBuffer(cb){ cb(bytes.slice()); },
    getBlob(cb){ cb(new Blob([bytes], {type: 'application/pdf'})); }};
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function htmlBlocks(item, tokens, o){
  const toks = Object.assign({}, tokens || {}, item.tokens || {});
  return item.blocks.map(b => {
    if (b.t === 'h') return `<h4>${htmlRuns(b.text)}</h4>`;
    if (b.t === 'p') return `<p>${htmlRuns(b.text)}</p>`;
    if (b.t === 'ul') return `<ul>${b.items.map(i => `<li>${htmlRuns(i)}</li>`).join('')}</ul>`;
    if (b.t === 'ol') return `<ol>${b.items.map(i => `<li>${htmlRuns(i)}</li>`).join('')}</ol>`;

function htmlFs(it, o){

    s.items.forEach(it => {
      if (it.k === 'fs'){ aoa.push(['', 'Note', it.years[0], it.years[1]]); it.rows.forEach(r => aoa.push(r.style === 'gap' ? [] : r.style === 'grp' ? [r.label] : [r.label, r.note || '', Math.round(r.cy || 0), Math.round(r.py || 0)])); }

  const notes = M.sections.find(x => x.id === 'notes'); const aoa = [[client.name], ['NOTES TO THE FINANCIAL STATEMENTS'], []];

    if (it.k === 'grid'){ aoa.push(it.header.map(h => String(h).replace(/\n/g, ' '))); it.rows.forEach(r => aoa.push((r.cells || []).map(c => typeof c === 'number' ? Math.round(c) : c))); }

  const payload = JSON.stringify({app: 'fairtax-audit-desk', version: 1, saved: new Date().toISOString(), client: {name: client.name, profile: client.profile}, eng});
  const chunks = [['Fair Tax Audit Desk data – do not edit']];
  for (let i = 0; i < payload.length; i += 30000) chunks.push([payload.slice(i, i + 30000)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(chunks), '_data');

const AI_KEY_STORE = 'fairtax-audit-desk-ai-key';   // kept outside the data/backup file
const AI_MODELS = [['claude-sonnet-5', 'Claude Sonnet 5 – recommended'], ['claude-haiku-4-5-20251001', 'Claude Haiku 4.5 – fastest, lowest cost'], ['claude-opus-5', 'Claude Opus 5 – most careful']];
const AI = {
  key(){ try { return localStorage.getItem(AI_KEY_STORE) || ''; } catch (e) { return ''; } },
  setKey(k){ try { if (k) localStorage.setItem(AI_KEY_STORE, k.trim()); else localStorage.removeItem(AI_KEY_STORE); } catch (e) {} },
  model(){ return (typeof DB !== 'undefined' && DB && DB.settings && DB.settings.aiModel) || AI_MODELS[0][0]; },
  mediaType(file){
    const t = (file.type || '').toLowerCase(), n = (file.name || '').toLowerCase();
    if (t === 'application/pdf' || n.endsWith('.pdf')) return 'application/pdf';
    if (/jpe?g$/.test(n) || t === 'image/jpeg') return 'image/jpeg';
    if (n.endsWith('.png') || t === 'image/png') return 'image/png';
    if (n.endsWith('.webp') || t === 'image/webp') return 'image/webp';
    if (n.endsWith('.gif') || t === 'image/gif') return 'image/gif';
    return '';
  },
  base64(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(new Error('Could not read ' + file.name)); fr.readAsDataURL(file); }); },
  async block(file){
    const mt = AI.mediaType(file);
    if (!mt) throw new Error(`${file.name}: please use PDF, JPG or PNG`);
    if (file.size > 25 * 1024 * 1024) throw new Error(`${file.name} is larger than 25 MB – please scan at a lower resolution`);
    const data = await AI.base64(file);
    return mt === 'application/pdf' ? {type: 'document', source: {type: 'base64', media_type: mt, data}, title: file.name}
      : {type: 'image', source: {type: 'base64', media_type: mt, data}};
  },
  async call(content, maxTokens){
    const key = AI.key();
    if (!key) throw new Error('Add your Claude API key in Settings & backup first');
    let res;
    try {
      res = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST',
        headers: {'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
        body: JSON.stringify({model: AI.model(), max_tokens: maxTokens || 4000, messages: [{role: 'user', content}]})});
    } catch (e) { throw new Error('Could not reach Claude – check the internet connection (the preview window may also block it; open the software in Chrome or Edge)'); }
    let body = null; try { body = await res.json(); } catch (e) {}
    if (!res.ok){
      const msg = body && body.error && body.error.message || res.statusText;
      if (res.status === 401) throw new Error('The Claude API key is not valid – check it in Settings & backup');
      if (res.status === 403) throw new Error('This API key is not allowed to use Claude: ' + msg);
      if (res.status === 429) throw new Error('Claude is busy or the account limit was reached – try again in a minute');
      if (res.status === 413) throw new Error('The documents are too large – upload fewer pages or a smaller scan');
      if (/credit|billing|balance/i.test(msg)) throw new Error('The Anthropic account has no credit – add credit at console.anthropic.com');
      throw new Error('Claude could not read the documents: ' + msg);
    }
    return (body.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  },
  json(text){
    const s = String(text || '').replace(/```(?:json)?/g, '');
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a < 0 || b < a) throw new Error('Claude did not return the details in the expected form – please try again');
    return JSON.parse(s.slice(a, b + 1));
  }
};

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function niceDate(s){
  const m = String(s || '').match(/(\d{1,2})[\-\/.](\d{1,2})[\-\/.](\d{4})/);
  if (!m) return String(s || '').trim();
  const d = +m[1], mo = +m[2];
  return mo >= 1 && mo <= 12 ? `${String(d).padStart(2, '0')} ${MONTHS[mo - 1]} ${m[3]}` : s;
}
async function pdfTextLines(file){
  const lib = await pdfjs();
  const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false}).promise;
  const lines = [];
  for (let i = 1; i <= pdf.numPages; i++){
    const tc = await (await pdf.getPage(i)).getTextContent();
    const rows = {};
    tc.items.forEach(it => { const y = Math.round(it.transform[5] / 2); (rows[y] = rows[y] || []).push(it); });
    Object.keys(rows).sort((a, b) => b - a).forEach(y => lines.push(rows[y].sort((a, b) => a.transform[4] - b.transform[4]).map(t => t.str).join('  ')));
  }
  // drop Arabic script, keep English and numbers
  return lines.map(l => l.replace(/[\u0600-\u06FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g, ' ').replace(/\s{2,}/g, '  ').trim()).filter(Boolean);
}

    [/umm\s*al\s*quwain/i, 'Umm Al Quwain', 'Umm Al Quwain Department of Economic Development'], [/fujairah/i, 'Fujairah', 'Fujairah Department of Economic Development']];
  const a = AUTH.find(([re]) => re.test(all)); if (a){ x.emirate = a[1]; x.licensing_authority = a[2]; }
  const nat = pick(/Nationality[\s\S]{0,300}?\b(India|Pakistan|United Arab Emirates|Bangladesh|Egypt|Jordan|Syria|Lebanon|Philippines|Sri Lanka|Nepal|China|United Kingdom|Iran|Saudi Arabia|Oman|Sudan|Yemen|Afghanistan)\b/i);
  const owner = pick(/\n\s*([A-Z][A-Z .'\-]{8,})\s*\n\s*(?:Owner|Partner|Manager|Shareholder)/);
  if (owner){ x.shareholders = [{name: owner.replace(/\s+/g, ' ').trim(), nationality: '', country: nat, percent: +(pick(/(\d{1,3}(?:\.\d+)?)\s*%/) || 100), shares: null, value_per_share: null}]; }

}
async function basicReadProfile(files){
  const pdfs = files.filter(f => AI.mediaType(f) === 'application/pdf');
  if (!pdfs.length) throw new Error('Reading without AI works only for PDF files that contain text. Add a Claude API key to read scans and photos.');
  let lines = [];
  for (const f of pdfs) lines = lines.concat(await pdfTextLines(f));
  if (lines.join('').replace(/\s/g, '').length < 40) throw new Error('These PDFs are scans (no text inside). Add a Claude API key in Settings to read them.');
  return basicExtract(lines);
}

const NATIONALITY = {india: 'Indian', pakistan: 'Pakistani', 'united arab emirates': 'Emirati', uae: 'Emirati', bangladesh: 'Bangladeshi', egypt: 'Egyptian', jordan: 'Jordanian', syria: 'Syrian', lebanon: 'Lebanese', philippines: 'Filipino', 'sri lanka': 'Sri Lankan', nepal: 'Nepalese', china: 'Chinese', 'united kingdom': 'British', iran: 'Iranian', 'saudi arabia': 'Saudi', oman: 'Omani', sudan: 'Sudanese', yemen: 'Yemeni', afghanistan: 'Afghan'};
function profileSuggestions(x, c){
  const p = c.profile || {};
  const s = v => (v === null || v === undefined) ? '' : String(v).trim();
  const title = t => s(t) ? s(t).replace(/\s+/g, ' ') : '';
  const emirate = title(x.emirate);
  const sh = (Array.isArray(x.shareholders) ? x.shareholders : []).filter(k => s(k.name)).map(k => ({name: title(k.name), nationality: s(k.nationality) || NATIONALITY[s(k.country).toLowerCase()] || '', country: s(k.country), percent: +k.percent || 0, shares: +k.shares || 0, value: +k.value_per_share || 0}));
  // work out shares & value when the documents give only capital / percentages
  const capital = +x.share_capital_aed || 0, totalShares = +x.total_shares || 0;
  let assumed = false;
  if (sh.length){
    const pctSum = sh.reduce((a, k) => a + k.percent, 0) || 100;
    sh.forEach(k => {
      if (!k.percent) k.percent = sh.length === 1 ? 100 : 0;
      if (!k.shares && totalShares) k.shares = Math.round(totalShares * k.percent / pctSum);
      if (!k.value && capital && totalShares) k.value = Math.round(capital / totalShares);
      if (!k.shares && !k.value && capital){
        const part = capital * k.percent / pctSum;
        if (part % 1000 === 0){ k.shares = part / 1000; k.value = 1000; assumed = true; } else { k.shares = 1; k.value = Math.round(part); }
      }
    });
  }
  // person names printed in capitals → Title Case
  const tidyName = n => (n === n.toUpperCase() ? n.toLowerCase().replace(/\b([a-z])/g, ch => ch.toUpperCase()) : n);
  sh.forEach(k => { k.name = tidyName(k.name); });
  let manager = s(x.manager_description);
  const doubts = (Array.isArray(x.doubts) ? x.doubts : []).filter(Boolean);
  const mName = s(x.manager_name) ? tidyName(title(x.manager_name)) : (sh.length === 1 ? sh[0].name : '');
  if (!manager && mName){
    const m = sh.find(k => k.name.toLowerCase() === mName.toLowerCase());
    manager = `${mName}${m && m.nationality ? `, ${/^[aeiou]/i.test(m.nationality) ? 'an' : 'a'} ${m.nationality} national` : ''}${m && sh.length === 1 ? ', who is the sole owner and manager of the Entity' : ', who is the manager of the Entity'}`;
    if (!s(x.manager_name)) doubts.push('Manager taken as the sole shareholder – check the licence.');
  }
  if (assumed) doubts.push('Number of shares worked out at AED 1,000 per share – check the MOA.');
  const exp = s(x.licence_expiry_date);
  const rows = [
    ['name', 'Company name', s(x.company_name), c.name],
    ['emirate', 'Emirate', emirate, p.emirate],
    ['cityLine', 'Address line on statements', emirate ? `${emirate}, U.A.E.` : '', p.cityLine],
    ['legalForm', 'Legal form', s(x.legal_form), p.legalForm],
    ['licenceNo', 'Licence no.', s(x.licence_no), p.licenceNo],
    ['authority', 'Licensing authority', s(x.licensing_authority), p.authority],
    ['licenceIssue', 'Licence issue date', s(x.licence_issue_date), p.licenceIssue],
    ['licenceExpiry', 'Licence expiry date', s(x.licence_expiry_date), p.licenceExpiry],
    ['estDate', 'Date established', s(x.establishment_date), p.estDate],
    ['registrationNo', 'Register no.', s(x.registration_no), p.registrationNo],
    ['nameArabic', 'Name in Arabic', s(x.company_name_arabic), p.nameArabic],
    ['activity', 'Principal activities', s(x.activities), p.activity],
    ['office', 'Registered office', s(x.registered_office), p.office],
    ['manager', 'Management', manager, p.manager],
    ['moaNo', 'MOA contract no.', s(x.moa_contract_no), p.moaNo],
    ['moaDate', 'MOA attested on', s(x.moa_date), p.moaDate],
    ['localLaw', 'Local law reference', s(x.local_law), p.localLaw],
    ['yearEndText', 'Financial year end', s(x.financial_year_end), p.yearEndText]
  ].map(([key, label, found, current]) => ({key, label, found, current: s(current)}));
  return {rows, shareholders: sh, doubts, expiry: exp};
}

function ppeMatrix(en, r){
  const cls = r.ppe, Y = en.year, PY = Y - 1, T = r.ppeT;
  const yeText = ((client() || {}).profile || {}).yearEndText || 'December 31';
  const isDec = /december\s*31/i.test(yeText);
  const d = (yr, open) => isDec ? (open ? `01-01-${yr}` : `31-12-${yr}`) : (open ? `start of ${yr}` : `end of ${yr}`);
  if (!cls.length) return `<div class="empty-block">No asset classes yet. Add one column per asset class (e.g. Motor vehicles, Furniture and fixtures) – the note is built in the same layout as the Excel schedule.</div>`;
  const inp = (x, f) => `<td><input class="numi${fxCls(en, `P:${x.id}:${f}`)}" id="pm-${f}-${x.id}" data-ppe="${x.id}" data-field="${f}"${fxAttrs(en, `P:${x.id}:${f}`, `{${Y}:P:${x.id}:${f}}`)} value="${fmtIn(x[f])}" inputmode="decimal" aria-label="${e_(x.name)} ${f}"></td>`;
  const tot = f => `<td class="r calc b"${fxRefAttr(`{${Y}:P:*:${f}}`)}>${fmtN(T[f])}</td>`;
  const inRow = (label, f) => `<tr><th scope="row">${label}</th>${cls.map(x => inp(x, f)).join('')}${tot(f)}</tr>`;
  const calcRow = (label, f, cl) => `<tr class="${cl || ''}"><th scope="row">${label}</th>${cls.map(x => `<td class="r calc"${fxRefAttr(`{${Y}:P:${x.id}:${f}}`)}>${fmtN(x[f])}</td>`).join('')}${tot(f)}</tr>`;
  const sub = label => `<tr class="msub"><th colspan="${cls.length + 2}">${label}</th></tr>`;

  return `<div class="table-wrap"><table class="ui matrix">
    <thead><tr><th>Asset class</th>${cls.map(x => `<th><input class="m-name" id="pm-name-${x.id}" data-ppe="${x.id}" data-field="name" value="${e_(x.name)}" placeholder="Class name" aria-label="Asset class name"></th>`).join('')}<th class="r">Total</th></tr></thead>
    <tbody>
      <tr><th scope="row">Useful life (years)</th>${cls.map(x => `<td><input class="numi s" id="pm-life-${x.id}" data-ppe="${x.id}" data-field="life" value="${e_(x.life || '')}" aria-label="Useful life"></td>`).join('')}<td></td></tr>
      ${sub('Cost')}
      ${inRow(`Opening balance as at ${d(Y, true)}`, 'costOpen')}${inRow('Additions during the year', 'add')}${inRow('Disposals during the year', 'disp')}
      ${calcRow(`Closing balance as at ${d(Y, false)}`, 'costClose', 'tot')}
      ${sub('Less: Accumulated depreciation')}
      ${inRow(`Opening balance as at ${d(Y, true)}`, 'depOpen')}${inRow('Charged during the year', 'charge')}${inRow('Relating to disposals', 'depDisp')}
      ${calcRow(`Closing balance as at ${d(Y, false)}`, 'depClose', 'tot')}
      ${calcRow(`Net book value as at ${d(Y, false)}`, 'nbv', 'grand')}${calcRow(`Net book value as at ${d(PY, false)}`, 'nbvPy')}
      <tr class="mdocs"><th scope="row">Proof</th>${cls.map(x => `<td>${docCell('ppe', orig(x.id))}</td>`).join('')}<td></td></tr>
      <tr class="mdel"><th scope="row"></th>${cls.map(x => `<td class="r"><button class="icon-btn" data-act="del-ppe" data-id="${x.id}" title="Remove ${e_(x.name)}">${IC.trash}</button></td>`).join('')}<td></td></tr>
    </tbody></table></div>

function ppeComparative(en, r, d){

  const calc = v => `<td class="r calc b">${fmtN(v)}</td>`;
  const neg = v => v ? `(${fmtN(v)})` : '-';
  return `<div class="sub-head">Comparative – written down value (prints on the next page, same note number)</div>
    <div class="table-wrap"><table class="ui matrix wdv">
      <colgroup><col><col style="width:170px"><col style="width:170px"></colgroup>
      <thead><tr><th>Particulars</th><th class="r">FY${Y}</th><th class="r">FY${PY} <span class="muted">(enter)</span></th></tr></thead>
      <tbody>
        ${row('Opening written down value', fmtN(T.nbvPy), `<td><input class="numi${fxCls(en, 'B:ppePy.open')}${T.pyOpenTyped ? ' ov' : ''}" id="ppy-open" data-bind="eng.ppePy.open" data-num="1" inputmode="decimal"${fxAttrs(en, 'B:ppePy.open', '')} value="${T.pyOpenTyped ? e_(R(P.open).toLocaleString('en-US')) : ''}" placeholder="${e_(fmtN(T.nbvPyOpenAuto))} (auto)" title="Type the opening WDV from last year’s audited report, or leave blank to work it back" aria-label="Opening written down value ${PY}"></td>`)}
        ${row('Add: Additions during the year', fmtN(T.add), pin('add', 'Additions'))}
        ${row('Less: Disposals at written down value', neg(T.dispWdv), pin('disp', 'Disposals at written down value'))}
        ${row('Less: Depreciation charge for the period', neg(T.charge), pin('charge', 'Depreciation charge'))}
        ${row('Closing written down value', fmtN(T.nbv), calc(T.nbvPy), 'grand')}
        ${T.pyDiff ? `<tr class="wdv-diff"><th scope="row">FY${PY} figures above add up to ${fmtN(T.pyCloseCalc)} – difference</th><td></td><td class="r bad-t b">${fmtN(T.pyDiff)}</td></tr>` : ''}
      </tbody></table></div>
    <p class="matrix-note">FY${PY} closing WDV = FY${Y} opening cost less opening depreciation above. ${T.pyOpenTyped ? `FY${PY} opening WDV is typed – the check below the table shows if the FY${PY} figures do not add up to the closing WDV. Clear the box to work it back automatically.` : `FY${PY} opening WDV is worked back automatically (${fmtN(T.nbvPyOpenAuto)}) – or type it from last year’s audited report to check the FY${PY} figures.`}${!T.pyOpenTyped && T.nbvPyOpen < 0 ? ' <b class="bad-t">Opening WDV is negative – check the FY' + PY + ' figures.</b>' : ''}${T.pyDiff ? ` <b class="bad-t">FY${PY}: opening ${R(T.nbvPyOpen).toLocaleString('en-US')} + additions ${R(T.pyAdd).toLocaleString('en-US')} − disposals ${R(T.pyDispWdv).toLocaleString('en-US')} − depreciation ${R(T.pyCharge).toLocaleString('en-US')} = ${R(T.pyCloseCalc).toLocaleString('en-US')}, not ${R(T.nbvPy).toLocaleString('en-US')}.</b>` : ''}</p>`;

/* ---------- page images of the PDF (pdf.js) – used for preview and printing, works without a PDF viewer ---------- */
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('Could not load the page viewer – check the internet connection')); document.head.appendChild(el); }); }
async function pdfjs(){
  if (!window.pdfjsLib){ await loadScript(PDFJS_BASE + 'pdf.worker.min.js'); await loadScript(PDFJS_BASE + 'pdf.min.js'); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function pdfPages(doc, scale, onPage, alive){
  const lib = await pdfjs();
  const data = await new Promise(res => doc.getBuffer(buf => res(new Uint8Array(buf))));
  const pdf = await lib.getDocument({data, isEvalSupported: false}).promise;
  for (let i = 1; i <= pdf.numPages; i++){
    if (alive && !alive()) break;
    const page = await pdf.getPage(i);
    const vp = page.getViewport({scale});
    const cv = document.createElement('canvas'); cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    await page.render({canvasContext: g, viewport: vp}).promise;
    onPage(cv, i, pdf.numPages, page.getViewport({scale: 1}));
  }
  return pdf.numPages;
}
async function blobOf(doc){ return new Promise(res => doc.getBlob(res)); }
async function previewPdf(doc, label, opts){
  UI.pvDoc = doc; UI.pvName = `${safeName(client().name)}_FS_${eng().year}${label ? '_selected' : ''}.pdf`;
  const token = uid(); UI.pvToken = token;
  modal(`<div class="row between pv-head"><h2>Preview${label ? ' – ' + e_(label) : ''} <span class="muted small" id="pv-count"></span></h2>
      <div class="row"><button class="btn primary" data-act="pv-refresh" id="pv-refresh" hidden>⟳ Update pages</button><button class="btn" data-act="pv-print">${IC.print}Print</button><button class="btn" data-act="pv-download">${IC.down}Download PDF</button><button class="btn" data-close>Close</button></div></div>
    <div class="pv-pages" id="pv-pages"><div class="pv-wait"><span class="spinner"></span>Preparing pages…</div></div>`, true);
  document.querySelector('.modal').classList.add('xwide');
  const box = document.getElementById('pv-pages');
  const alive = () => UI.pvToken === token && document.getElementById('pv-pages');
  try {
    let first = true;
    const scale = Math.min(2.2, 1.35 * (window.devicePixelRatio || 1));
    await pdfPages(doc, scale, (cv, i, n) => {
      if (!alive()) return;
      if (first){ box.innerHTML = ''; first = false; }
      document.getElementById('pv-count').textContent = `${n} pages`;
      cv.className = 'pv-page'; cv.setAttribute('aria-label', `Sheet ${i} of ${n}`);
      const w = document.createElement('div'); w.className = 'pv-sheet'; w.appendChild(cv);
      const cap = document.createElement('div'); cap.className = 'pv-cap'; cap.textContent = `Sheet ${i} of ${n}`; w.appendChild(cap);
      const sh = (doc.sheets || [])[i - 1];
      if (sh && sh.notes){ const yl = document.createElement('label'); yl.className = 'pv-yr' + (sh.off ? ' off' : ''); yl.innerHTML = `<input type="checkbox" data-pvyr="${e_(sh.key + ':' + sh.cur)}"${sh.off ? '' : ' checked'}> Show the year columns (${sh.years[0]} · ${sh.years[1]}) at the top of this page${sh.tbl ? '' : ' <span>· no amount table on this page</span>'}`; w.insertBefore(yl, cv); }
      box.appendChild(w);
      if (opts && opts.scroll && box.scrollHeight > opts.scroll + box.clientHeight) { box.scrollTop = opts.scroll; opts.scroll = 0; }
    }, alive);
  } catch (err) {
    // fallback: browser PDF viewer
    const url = URL.createObjectURL(await blobOf(doc));
    if (alive()) box.innerHTML = `<p class="small bad-t">${e_(err.message)}</p><iframe class="pdf-frame" src="${url}" title="PDF preview"></iframe>`;
  }
}
async function printPdf(doc){
  toast('Preparing pages for printing…');
  const imgs = []; let size = [595.28, 841.89];

  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t0 = Date.now();

  const quick = Date.now() - t0 < 150;
  const cleanup = () => { root.innerHTML = ''; };
  if (quick){ window.addEventListener('afterprint', cleanup, {once: true}); setTimeout(() => { if (EMBEDDED) blockedHelp('print'); }, 400); setTimeout(cleanup, 60000); }
  else cleanup();
}
function layMove(en, type, id, targetId, after){
  const L = layoutOf(en);
  const list = type === 'sec' ? L.order.slice() : buildReport(client(), en, prev()).noteList.map(n => n.key);
  if (id === targetId || list.indexOf(id) < 0 || list.indexOf(targetId) < 0) return false;
  list.splice(list.indexOf(id), 1);
  const at = list.indexOf(targetId);
  list.splice(after ? at + 1 : at, 0, id);
  if (type === 'sec') L.order = list; else L.noteOrder = list;
  return true;
}

async function letterheadFromFile(file){
  const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('This picture could not be opened – use JPG or PNG')); im.src = url; });
  const w = Math.min(1240, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', 0.82);
}

/* ============================================================

function setNoteNumber(c, en, key, newNum, mode){
  const M = buildReport(c, en, prevOf(c, en));
  const list = M.noteList.map(n => n.key);
  const k = key === 'dep' ? 'ppe' : key, from = list.indexOf(k), to = newNum - 5;
  if (from < 0) throw new Error('This schedule has no note in the report yet (no figures, or its note is switched off).');
  if (!(to >= 0 && to < list.length)) throw new Error(`Choose a note number from 5 to ${list.length + 4}`);
  if (to === from) return false;
  const full = (M.allNoteKeys || list).slice();
  if (mode === 'swap'){ const other = list[to], a = full.indexOf(k), b = full.indexOf(other); full[a] = other; full[b] = k; }
  else { const target = list[to]; full.splice(full.indexOf(k), 1); const at = full.indexOf(target); full.splice(to > from ? at + 1 : at, 0, k); }
  layoutOf(en).noteOrder = full;
  return true;
}
function noteNumModal(key){
