async function createYear(){
  const c = client(), year = num(document.getElementById('ay-year').value), type = document.getElementById('ay-type').value;
  const srcIn = document.querySelector('input[name=ay-src]:checked'); if (!srcIn){ toast('Choose how the year should start', true); return; }
  if (c.engagements.some(e => e.year === year)){ toast(`FY${year} already exists`, true); return; }
  const src = srcIn.value, before = fxEngOf(c, year - 1), after = fxEngOf(c, year + 1);
  const nearest = c.engagements.slice().sort((a, b) => Math.abs(a.year - year) - Math.abs(b.year - year))[0];
  let n, msg = '';
  if (src === 'carry'){
    n = rollForward(c, before); n.type = type; c.engagements.push(n);
    const res = fxLinkToPrev(c, n); msg = `FY${year} created – ${res.n} figures linked live to FY${year - 1}`;
  } else if (src === 'back'){
    n = yearFromNext(c, after, year, type); c.engagements.push(n);
    freezeCfPy(c, after); fxLinkToPrev(c, after); fxRecalc(c);
    msg = `FY${year} created from FY${year + 1}’s prior year figures – FY${year + 1} is now linked to it`;
  } else if (src === 'file'){

  } else {
    n = newEngagement(year, type); copyStructure(nearest, n); c.engagements.push(n); msg = `FY${year} created`;
  }

  UI.engId = n.id; UI.view = 'tb'; save(); closeModal(); render(); toast(msg);
}
function copyStructure(from, n){
  if (!from) return;
  n.schedules = JSON.parse(JSON.stringify(ensureSchedules(from))); ensureSchedules(n);
  n.texts = JSON.parse(JSON.stringify(from.texts)); n.customNotes = JSON.parse(JSON.stringify(from.customNotes || []));
  n.layout = JSON.parse(JSON.stringify(layoutOf(from))); n.settings.deprMethod = from.settings.deprMethod;
  if (from.cfLayout) n.cfLayout = JSON.parse(JSON.stringify(from.cfLayout));
}
/* keep a year's prior-year cash flow exactly as it is before it gets linked to a new earlier year */
function freezeCfPy(c, en){
  const r = compute(en, prevOf(c, en)), cfp = r.cfp; en.cfPy = en.cfPy || {};
  CFPY_KEYS.forEach(k => { if (en.cfPy[k] === undefined) en.cfPy[k] = R(cfp[k]); });
  Object.keys(cfp.custom || {}).forEach(k => { if (en.cfPy[k] === undefined) en.cfPy[k] = R(cfp.custom[k]); });
}
function yearFromNext(c, next, year, type){
  const n = newEngagement(year, type); copyStructure(next, n);

  n.tb = next.tb.filter(l => R(l.py) || !['re', 'lr'].includes(l.fs)).map(l => ({id: uid(), ledger: l.ledger, fs: l.fs, caption: l.caption, amt: R(l.py), py: 0, docs: []}));
  n.settings.lrTransfer = R(rn.py.lrTransfer);

  n.pyInfo.caOpen = 0;
  const caL = n.tb.filter(l => l.fs === 'ca'); if (caL.length) caL[0].py = R(rn.py.caOpen);
  // PPE: closing = next year's opening; last year's movements go into the first class (split them by class if needed)
  n.ppe = (next.ppe || []).map(p => ({id: uid(), name: p.name, life: p.life, costOpen: R(p.costOpen), add: 0, disp: 0, depOpen: R(p.depOpen), charge: 0, depDisp: 0, docs: []}));
  if (n.ppe.length){ const P = next.ppePy || {}, f = n.ppe[0]; f.add = R(P.add); f.charge = R(P.charge); f.disp = R(P.disp); f.costOpen += f.disp - f.add; f.depOpen -= f.charge; }

  const reLines = n.tb.filter(l => l.fs === 're'), lrLines = n.tb.filter(l => l.fs === 'lr');
  const reOpen = R(rn.py.reClose) - r.cy.pat + r.cy.div + r.cy.lrTransfer, lrOpen = R(rn.py.lrClose) - r.cy.lrTransfer;
  reLines.forEach((l, i) => { l.amt = i ? 0 : reOpen; }); if (!reLines.length && reOpen) n.tb.push({id: uid(), ledger: 'Retained earnings', fs: 're', caption: '', amt: reOpen, py: 0, docs: []});
  lrLines.forEach((l, i) => { l.amt = i ? 0 : lrOpen; }); if (!lrLines.length && lrOpen) n.tb.push({id: uid(), ledger: 'Legal reserve', fs: 'lr', caption: '', amt: lrOpen, py: 0, docs: []});
  return n;
}

/* ============================================================
   IMPORT FINANCIAL STATEMENTS – the Fair Tax Excel workbook (statements, notes, PPE, cash flow)
   ============================================================ */
const fsTxt = v => v === null || v === undefined ? '' : String(v).replace(/\s+/g, ' ').trim();
const fsNum = v => typeof v === 'number' && isFinite(v) ? v : (typeof v === 'string' && /^\(?-?[\d,]+(\.\d+)?\)?$/.test(v.trim()) && /\d/.test(v) ? num(v) : null);
const fsTitleCase = s => String(s || '').toLowerCase().replace(/(^|[\s(’'-])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(And|Of|The|In|On|For|To)\b/g, w => w.toLowerCase()).replace(/^./, ch => ch.toUpperCase());
function fsRows(wb, name){ return XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null, blankrows: true}); }
function fsYearCols(row){
  const ys = [];
  (row || []).forEach((c, j) => { const t = fsTxt(c); if (/^(19|20)\d\d$/.test(t)) ys.push({j, y: +t}); });
  if (ys.length < 2) return null;
  ys.sort((a, b) => b.y - a.y);
  return ys[0].y - ys[1].y === 1 ? {cy: ys[0].j, py: ys[1].j, year: ys[0].y} : null;
}
function fsStatement(rows){
  let yc = null, noteC = -1; const lines = [];
  rows.forEach((r, i) => {
    r = r || [];
    const y = fsYearCols(r);
    if (y){ yc = y; const nc = r.findIndex(c => /^notes?$/i.test(fsTxt(c))); if (nc >= 0) noteC = nc; return; }
    if (!yc){ const nc = r.findIndex(c => /^notes?$/i.test(fsTxt(c))); if (nc >= 0) noteC = nc; return; }
    const lim = noteC >= 0 && noteC < Math.min(yc.cy, yc.py) ? noteC : Math.min(yc.cy, yc.py);
    let label = ''; for (let j = lim - 1; j >= 0; j--){ const t = fsTxt(r[j]); if (t && fsNum(r[j]) === null){ label = t; break; } }
    lines.push({label, note: noteC >= 0 ? fsTxt(r[noteC]).replace(/\.$/, '') : '', cy: fsNum(r[yc.cy]), py: fsNum(r[yc.py]), i});
  });
  return {year: yc ? yc.year : 0, lines};
}
function fsNoteHeads(rows){
  const out = [];
  rows.forEach((r, i) => {
    r = r || [];
    for (let j = 0; j < Math.min(r.length, 6); j++){
      const t = fsTxt(r[j]); if (!t) continue;
      const m = /^(\d{1,2})\.?$/.exec(t); if (!m) break;
      const n = +m[1]; if (n < 4 || n > 90) break;
      let k = j + 1; while (k < r.length && !fsTxt(r[k])) k++;
      const title = fsTxt(r[k]);
      if (title && /[A-Z]{3}/.test(title) && title === title.toUpperCase() && fsNum(r[k]) === null) out.push({i, num: n, title, col: k});
      break;
    }
  });
  return out;
}
function fsFindSheets(wb){
  const T = {bs: /STATEMENT OF FINANCIAL POSITION|BALANCE SHEET/, pl: /STATEMENT OF (PROFIT|COMPREHENSIVE INCOME|INCOME)|INCOME STATEMENT|PROFIT AND LOSS ACCOUNT/, eq: /STATEMENT OF CHANGES/, cf: /STATEMENT OF CASH ?FLOW|CASH FLOW STATEMENT/};
  const info = wb.SheetNames.map(n => { const rows = fsRows(wb, n); const top = rows.slice(0, 12).map(r => (r || []).map(fsTxt).join(' ')).join(' ').toUpperCase(); return {n, rows, top}; });
  const out = {};
  Object.entries(T).forEach(([k, re]) => {
    const cands = info.filter(x => re.test(x.top) && Object.entries(T).filter(([k2, re2]) => k2 !== k && re2.test(x.top)).length === 0);
    out[k] = cands.find(x => k === 'eq' || fsStatement(x.rows).year) || {};
  });
  const best = info.map(x => ({x, count: fsNoteHeads(x.rows).length})).sort((a, b) => b.count - a.count)[0];
  out.notes = best && best.count >= 2 ? best.x : {};
  return out;
}
function fsNotes(rows){
  const heads = fsNoteHeads(rows), notes = [];
  heads.forEach((h, hi) => {
    const end = hi + 1 < heads.length ? heads[hi + 1].i : rows.length;
    let yc = null;
    for (let i = h.i; i >= 0 && !yc; i--) yc = fsYearCols(rows[i]);
    const body = [];
    for (let i = h.i + 1; i < end; i++){ const r = rows[i] || [], y = fsYearCols(r); if (y){ yc = y; continue; } body.push({i, r, yc}); }
    notes.push({num: h.num, title: h.title, col: h.col, head: rows[h.i] || [], body});
  });
  return notes;
}
function fsNoteLines(note){
  const lines = [], totals = [];
  note.body.forEach(({r, yc}) => {
    if (!yc) return;
    let cap = ''; for (let j = note.col; j < Math.min(yc.cy, yc.py); j++){ const t = fsTxt(r[j]); if (t && fsNum(r[j]) === null){ cap = t; break; } }
    const cy = fsNum(r[yc.cy]), py = fsNum(r[yc.py]);
    if (cy === null && py === null) return;
    if (!cap || /^(total|balance at the end|balance as at the end|closing balance|net book value|balance at \w+ 3[01])/i.test(cap)){ totals.push({cap, cy: cy || 0, py: py || 0}); return; }
    lines.push({cap, cy: cy || 0, py: py || 0});
  });
  return {lines, total: totals[totals.length - 1] || null};
}
function fsNoteKey(title){
  const t = String(title || '').toUpperCase();
  if (/FINANCIAL INSTRUMENT|RISK MANAGEMENT|CONTINGEN|COMMITMENT|APPROVAL OF|CORPORATE TAX|INCOME TAX|TAXATION|LEGAL STATUS|BASIS OF|ACCOUNTING POLIC|JUDG(E)?MENT|GOING CONCERN|SUBSEQUENT EVENT|COMPARATIVE FIGURE|RELATED PARTY TRANSACTIONS|FAIR VALUE/.test(t)) return null;
  if (/PROPERTY,?\s*PLANT|FIXED ASSETS/.test(t)) return 'ppe';
  if (/INVENTOR|STOCK/.test(t)) return 'inv';
  if (/RELATED PART/.test(t)) return /PAYABLE|DUE TO/.test(t) ? 'rppay' : 'rprec';
  if (/DUE FROM/.test(t)) return 'rprec';
  if (/DUE TO/.test(t)) return 'rppay';
  if (/RECEIVABLE|PREPAYMENT|DEBTORS/.test(t)) return 'rec';
  if (/CASH|BANK BALANCE/.test(t)) return 'cash';
  if (/SHARE CAPITAL|^CAPITAL$/.test(t)) return 'cap';
  if (/LEGAL RESERVE|STATUTORY RESERVE/.test(t)) return 'lr';
  if (/RETAINED EARNINGS|ACCUMULATED (PROFIT|LOSS)/.test(t)) return 're';
  if (/CURRENT ACCOUNT/.test(t)) return 'ca';
  if (/END OF SERVICE|GRATUITY/.test(t)) return 'eosb';
  if (/LONG.?TERM (LOAN|BORROW)/.test(t)) return 'ltl';
  if (/SHORT.?TERM|OVERDRAFT/.test(t)) return 'stb';
  if (/PAYABLE|CREDITORS|ACCRUAL/.test(t)) return 'pay';
  if (/COST OF (REVENUE|SALES|GOODS)|DIRECT COST/.test(t)) return 'cor';
  if (/^REVENUE|^SALES|TURNOVER/.test(t)) return 'rev';
  if (/GENERAL AND ADMIN|ADMINISTRATIVE/.test(t)) return 'ga';
  if (/SELLING|DISTRIBUTION|MARKETING/.test(t)) return 'sell';
  if (/FINANCE COST|INTEREST EXPENSE|BANK CHARGES/.test(t)) return 'fin';
  if (/GAIN ON|PROFIT ON (SALE|DISPOSAL)/.test(t)) return 'gain';
  if (/OTHER INCOME/.test(t)) return 'oi';
  if (/DEPRECIATION/.test(t)) return 'dep';
  return 'custom';
}
function fsPpe(note){
  const cand = [note.head].concat(note.body.slice(0, 4).map(b => b.r));
  let hdr = null;
  for (const r of cand){
    const tc = (r || []).findIndex((c, j) => j > note.col && /^total$/i.test(fsTxt(c)));
    if (tc < 0) continue;
    const cls = []; for (let j = note.col + 1; j < tc; j++){ const t = fsTxt(r[j]); if (t && fsNum(r[j]) === null && !/^aed$/i.test(t)) cls.push({j, name: t}); }
    if (cls.length){ hdr = {tc, cls}; break; }
  }
  if (!hdr) return null;
  const P = hdr.cls.map(c => ({id: uid(), name: c.name, life: '', costOpen: 0, add: 0, disp: 0, depOpen: 0, charge: 0, depDisp: 0, docs: []}));
  let sec = 'cost';
  for (const {r} of note.body){
    let cap = ''; for (let j = note.col; j < hdr.cls[0].j; j++){ const t = fsTxt(r[j]); if (t && fsNum(r[j]) === null){ cap = t; break; } }
    const hasNums = hdr.cls.some(c => fsNum(r[c.j]) !== null);
    if (/depreciation/i.test(cap) && !hasNums){ sec = 'dep'; continue; }
    if (/net book value|written down value|carrying amount/i.test(cap)) break;
    if (/useful life/i.test(cap)){ hdr.cls.forEach((c, k) => { P[k].life = fsTxt(r[c.j]); }); continue; }
    let f = null;
    if (/closing|at the end|balance as at 3[01]/i.test(cap)) f = null;
    else if (/opening|beginning|balance as at 0?1|brought forward/i.test(cap)) f = sec === 'cost' ? 'costOpen' : 'depOpen';
    else if (sec === 'cost' && /addition|purchase/i.test(cap)) f = 'add';
    else if (sec === 'cost' && /disposal|written off|sold|deletion/i.test(cap)) f = 'disp';
    else if (sec === 'dep' && /charge|for the year/i.test(cap)) f = 'charge';
    else if (sec === 'dep' && /disposal|relating|written off|deletion/i.test(cap)) f = 'depDisp';
    if (!f) continue;
    hdr.cls.forEach((c, k) => { const v = fsNum(r[c.j]); if (v !== null) P[k][f] = Math.abs(Math.round(v)); });
  }
  return P;
}
function fsCashFlow(cf){
  const maps = {cy: {}, py: {}}; let sec = 'op';
  cf.lines.forEach(l => {
    const t = l.label.toLowerCase();
    if (l.cy === null && l.py === null){ if (/operating/.test(t)) sec = 'op'; else if (/investing/.test(t)) sec = 'inv'; else if (/financing/.test(t)) sec = 'fin'; return; }

async function gsRead(id){

/* what the sheet now says, keyed to the software's lines */
function gsParse(en, data){

  const out = {lines: [], news: [], ppe: [], ppeNew: [], cf: [], cellRef};
  const [S, P, C] = data.f, [SV, PV, CV] = data.v;
  let cur = null;
  for (let i = 3; i < S.length; i++){
    const row = S[i] || [], vals = SV[i] || [], a = String(row[0] || ''), rn = i + 1;
    if (a.startsWith('#S:')){ cur = a.slice(3); continue; }
    if (a.startsWith('#T:')){ const k = a.slice(3); if (!(k === 'ppe' && en.ppe.length)){ cellRef[`${SU}!D${rn}`] = `{${Y}:S:${k}:cy}`; cellRef[`${SU}!E${rn}`] = `{${Y}:S:${k}:py}`; } cur = null; continue; }

    if (a.startsWith('L:') || (!a && cur && has)){
      const id = a.startsWith('L:') ? a.slice(2) : uid();
      (a ? out.lines : out.news).push({id, sched: cur, row, vals});
      cellRef[`${SU}!D${rn}`] = `{${Y}:L:${id}:amt}`; cellRef[`${SU}!E${rn}`] = `{${Y}:L:${id}:py}`;
    }
  }
  const PPE_COLS = {costOpen: 'D', add: 'E', disp: 'F', costClose: 'G', depOpen: 'H', charge: 'I', depDisp: 'J', depClose: 'K', nbv: 'L'};
  for (let i = 2; i < (P || []).length; i++){
    const row = P[i] || [], vals = (PV || [])[i] || [], a = String(row[0] || ''), rn = i + 1;
    if (a === '#T:ppe'){ Object.entries(PPE_COLS).forEach(([f, col]) => { cellRef[`${PU}!${col}${rn}`] = `{${Y}:P:*:${f}}`; }); continue; }
    if (!a.startsWith('P:') && !(String(row[1] || '').trim())) continue;
    const id = a.startsWith('P:') ? a.slice(2) : uid();
    (a.startsWith('P:') ? out.ppe : out.ppeNew).push({id, row, vals});
    Object.entries(PPE_COLS).forEach(([f, col]) => { cellRef[`${PU}!${col}${rn}`] = `{${Y}:P:${id}:${f}}`; });
  }

}
function gsCellToApp(raw, val, sheet, cellRef){
  if (typeof raw === 'string' && raw.startsWith('=')){
    try {
      let ok = true;
      const conv = n => {
        if (n.n !== undefined) return String(n.n);
        if (n.cell){
          const sh = (n.cell.sheet || sheet).toUpperCase(), refs = [], single = n.cell.r1 === n.cell.r2 && n.cell.c1 === n.cell.c2;
          for (let rr = Math.min(n.cell.r1, n.cell.r2); rr <= Math.max(n.cell.r1, n.cell.r2); rr++) for (let cc = colN(n.cell.c1); cc <= colN(n.cell.c2); cc++){ const ref = cellRef[`${sh}!${colL(cc)}${rr}`]; if (ref) refs.push(ref); else if (single) ok = false; }
          return refs.length === 0 ? '0' : refs.length === 1 ? refs[0] : 'SUM(' + refs.join(',') + ')';
        }
        if (n.r){ ok = false; return '0'; }
        if (n.neg) return '-(' + conv(n.neg) + ')';
        if (n.op) return '(' + conv(n.a) + n.op + conv(n.b) + ')';
        return n.fn + '(' + n.args.map(conv).join(',') + ')';
      };
      const f = '=' + conv(fxParse(raw, true));
      if (ok && /\{/.test(f)) return {f};
    } catch (e) {}
  }
  if (val === '' || val === null || val === undefined) return {v: 0};
  return {v: R(typeof val === 'number' ? val : num(val))};
}

      const sel = document.getElementById('rt-file-eng'); sel.innerHTML = rtFileOptions(UI.retrieveList, en); sel.disabled = false;
      const rb = document.querySelector('input[name=rt-src][value=file]'); if (rb) rb.checked = true; }
    catch (err) { toast(err.message, true); } el.value = ''; return; }
  if ((el.id === 'fs-in' || el.id === 'fs-in-client') && el.files[0]){
    const f = el.files[0]; el.value = '';
    try { toast('Reading the financial statements…'); const res = await readFsWorkbookFile(f); UI.fsImp = {res, fileName: f.name, newOnly: el.id === 'fs-in-client'}; document.querySelectorAll('.toast').forEach(x => x.remove()); fsImportModal(); }
    catch (err) { console.error(err); toast(err.message, true); } return; }
  if (el.id === 'ay-file-in' && el.files[0]){ UI.ayFile = el.files[0]; const s = document.getElementById('ay-file-name'); if (s) s.textContent = el.files[0].name; const rb = document.querySelector('input[name=ay-src][value=file]'); if (rb) rb.checked = true; return; }
  if (el.dataset.soce){ const x = (en.soceItems || []).find(i => i.id === el.dataset.soce); if (!x) return; const f = el.dataset.f; x[f] = f === 'label' ? el.value : num(el.value); save(); scheduleRender(); return; }
  if (el.dataset.pvyr){ const L = layoutOf(en);
    if (L.notesYears !== 'custom'){ L.yearsOff = {}; ((UI.pvDoc || {}).sheets || []).forEach(sh => { if (sh.notes && sh.off) L.yearsOff[sh.key + ':' + sh.cur] = true; }); L.notesYears = 'custom'; }
    if (el.checked) delete L.yearsOff[el.dataset.pvyr]; else L.yearsOff[el.dataset.pvyr] = true;
    el.closest('.pv-yr').classList.toggle('off', !el.checked);
    const b = document.getElementById('pv-refresh'); if (b) b.hidden = false; save(); scheduleRender(); return; }
  if (el.name === 'notes-years'){ const L = layoutOf(en); L.notesYears = el.value; save(); render(); return; }
  if (el.dataset.cflabel){ const k = el.dataset.cflabel, L = cfLayoutOf(en), x = cfLines(en).find(y => y.key === k), v = el.value.trim();
    if (!v || (x && v === x.def)) delete L.labels[k]; else L.labels[k] = v; save(); scheduleRender(); return; }
  if (el.dataset.cfcy){ const k = el.dataset.cfcy;
    if (!el.value.trim()){ if (en.cfCy) delete en.cfCy[k]; if (en.fx) delete en.fx['CFC:' + k]; }
    else { try { fxInput(c, en, 'CFC:' + k, el.value, v => { (en.cfCy = en.cfCy || {})[k] = v; }); } catch (err) { toast('Formula: ' + err.message, true); return; } }
    save(); scheduleRender(); return; }
  if (el.dataset.cfpy){ const k = el.dataset.cfpy;
    if (!el.value.trim()){ if (en.cfPy) delete en.cfPy[k]; if (en.fx) delete en.fx['CFP:' + k]; }
    else { try { fxInput(c, en, 'CFP:' + k, el.value, v => { (en.cfPy = en.cfPy || {})[k] = v; }); } catch (err) { toast('Formula: ' + err.message, true); return; } }
    save(); scheduleRender(); return; }
  if (el.id === 'import-saved' && el.files[0]){ try { await importSavedFile(el.files[0]); } catch (err) { toast(err.message, true); } el.value = ''; return; }
  if (el.id === 'xlsx-in' && el.files[0]){
    try { const buf = await el.files[0].arrayBuffer(); const wb = XLSX.read(buf); const ws = wb.Sheets[wb.SheetNames[0]]; const rows = parseRows(XLSX.utils.sheet_to_json(ws, {header: 1, raw: false}), en, '', 'drcr');
      if (!rows.length) throw new Error('No ledger rows found in the first sheet'); en.tb.push(...rows); fxTbImported(en, rows); save(); render(); toast(`${rows.length} lines imported`); }
    catch (err) { toast(err.message, true); } el.value = ''; return;
  }
  if (el.id === 'restore-in' && el.files[0]){
    try { const data = JSON.parse(await el.files[0].text()); if (!Array.isArray(data.clients)) throw new Error('This is not an Audit Desk backup file');
      if (confirm(`Restore ${data.clients.length} client(s)? This replaces the data in this browser.`)){ DB = data; save(); render(); toast('Backup restored'); } }
    catch (err) { toast(err.message, true); } el.value = ''; return;
  }
  if (el.id === 'show-empty'){ UI.showEmpty = el.checked; save(); render(); return; }
  if (el.dataset.ui){ UI[el.dataset.ui] = el.value; render(); return; }
  if (el.dataset.line){ const l = en.tb.find(x => x.id === el.dataset.line); const f = el.dataset.field; if (f === 'fs'){ moveLine(en, l, el.value); UI.justAdded[el.value] = true; } else if (['amt', 'py'].includes(f)){ try { fxInput(c, en, `L:${l.id}:${f}`, el.value, v => { l[f] = v; }); } catch (err) { toast('Formula: ' + err.message, true); return; } }
    else l[f] = el.value;
    if (f === 'ledger' && !l.fs){ const k = autoMap(l.ledger, en); if (k) moveLine(en, l, k); } save(); scheduleRender(); return; }
  if (el.dataset.ppe){ const p = en.ppe.find(x => x.id === el.dataset.ppe); const f = el.dataset.field; if (['name', 'life'].includes(f)) p[f] = el.value; else { try { fxInput(c, en, `P:${p.id}:${f}`, el.value, v => { p[f] = v; }); } catch (err) { toast('Formula: ' + err.message, true); return; } } save(); scheduleRender(); return; }
  if (el.dataset.sh !== undefined){ const s = c.profile.shareholders[+el.dataset.sh]; const f = el.dataset.field; s[f] = ['shares', 'value'].includes(f) ? num(el.value) : el.value; save(); scheduleRender(); return; }
  if (el.dataset.pol !== undefined){ en.texts.policies[+el.dataset.pol][el.dataset.field] = el.value; save(); if (el.dataset.field !== 'text') scheduleRender(); return; }
  if (el.dataset.cn !== undefined){ en.customNotes[+el.dataset.cn][el.dataset.field] = el.value; save(); return; }
  if (el.dataset.text){ en.texts[el.dataset.text] = el.value; save(); return; }
  if (el.dataset.bind){
    const path = el.dataset.bind;
    if (path === 'eng.settings.draftSel'){ en.settings.draft = el.value === '1'; save(); return; }
    if (path === 'eng.ppePy.open' && !el.value.trim()){ if (en.ppePy) delete en.ppePy.open; if (en.fx) delete en.fx['B:ppePy.open']; save(); scheduleRender(); return; }
    if (el.dataset.num && /^eng\./.test(path)){ try { fxInput(c, en, 'B:' + path.slice(4), el.value, v => setPath(path, v)); } catch (err) { toast('Formula: ' + err.message, true); return; } save(); scheduleRender(); return; }
    let val = el.dataset.num ? num(el.value) : el.value;
    if (path === 'client.name') c.name = val; else setPath(path, val);
    save(); scheduleRender();
  }
});
/* drop licence / MOA files on the profile */
['dragenter', 'dragover'].forEach(n => document.addEventListener(n, ev => { const z = ev.target.closest && ev.target.closest('#pd-drop'); if (!z || DRAG) return; ev.preventDefault(); z.classList.add('over'); }));
document.addEventListener('dragleave', ev => { const z = ev.target.closest && ev.target.closest('#pd-drop'); if (z && !z.contains(ev.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', ev => { const z = ev.target.closest && ev.target.closest('#pd-drop'); if (!z || DRAG) return; ev.preventDefault(); const fl = [...(ev.dataTransfer.files || [])]; if (fl.length){ UI.pdFiles = (UI.pdFiles || []).concat(fl); render(); } });
/* drag rows up and down on the Report layout screen */
let DRAG = null;
document.addEventListener('dragstart', ev => { const li = ev.target.closest && ev.target.closest('li[data-drag]'); if (!li) return; DRAG = {type: li.dataset.drag, id: li.dataset.id}; li.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', li.dataset.id); } catch (e) {} });
document.addEventListener('dragover', ev => { const li = ev.target.closest && ev.target.closest('li[data-drag]'); if (!DRAG || !li || li.dataset.drag !== DRAG.type) return; ev.preventDefault();
  const r = li.getBoundingClientRect(), after = ev.clientY > r.top + r.height / 2;
  document.querySelectorAll('.drop-before,.drop-after').forEach(x => { if (x !== li) x.classList.remove('drop-before', 'drop-after'); });
  li.classList.toggle('drop-after', after); li.classList.toggle('drop-before', !after); });
document.addEventListener('drop', ev => { const li = ev.target.closest && ev.target.closest('li[data-drag]'); if (!DRAG || !li || li.dataset.drag !== DRAG.type) return; ev.preventDefault();
  const r = li.getBoundingClientRect(), after = ev.clientY > r.top + r.height / 2;
  const en = eng(); if (layMove(en, DRAG.type, DRAG.id, li.dataset.id, after)){ save(); } DRAG = null; render(); });
document.addEventListener('dragend', () => { DRAG = null; document.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after')); });
document.addEventListener('input', ev => {
  if (ev.target.dataset && ev.target.dataset.ui === 'tbSearch'){ UI.tbSearch = ev.target.value; scheduleRender(); }
  if (ev.target.id === 'ay-year'){ const o = document.getElementById('ay-opts'); if (o) o.innerHTML = addYearOptions(client(), num(ev.target.value)); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && document.getElementById('layer').innerHTML) closeModal();
  if (ev.key === 'Enter' && ev.target.matches('td input, input.cf-label')){ ev.preventDefault(); ev.target.blur(); }
});

/* drag cash flow lines (Tax, reserve & prior year screen) */
let CFDRAG = null;
const cfDropAt = (tr, y) => tr.dataset.cfsec ? true : y > tr.getBoundingClientRect().top + tr.getBoundingClientRect().height / 2;
document.addEventListener('mousedown', ev => { const g = ev.target.closest && ev.target.closest('.cf-grip'); if (g) g.closest('tr').draggable = true; });
document.addEventListener('mouseup', () => { if (!CFDRAG) document.querySelectorAll('tr[data-cfk][draggable=true]').forEach(x => { x.draggable = false; }); });
document.addEventListener('dragstart', ev => { const tr = ev.target.closest && ev.target.closest('tr[data-cfk]'); if (!tr || !tr.draggable) return; CFDRAG = tr.dataset.cfk; tr.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', CFDRAG); } catch (e) {} });
document.addEventListener('dragover', ev => { if (!CFDRAG) return; const tr = ev.target.closest && ev.target.closest('tr[data-cfk],tr[data-cfsec]'); if (!tr) return; ev.preventDefault();
  const after = cfDropAt(tr, ev.clientY); document.querySelectorAll('.drop-before,.drop-after').forEach(x => { if (x !== tr) x.classList.remove('drop-before', 'drop-after'); });
  tr.classList.toggle('drop-after', after); tr.classList.toggle('drop-before', !after); });
document.addEventListener('drop', ev => { if (!CFDRAG) return; const tr = ev.target.closest && ev.target.closest('tr[data-cfk],tr[data-cfsec]'); const k = CFDRAG; CFDRAG = null; if (!tr) { render(); return; } ev.preventDefault();
  const en = eng(), L = cfLayoutOf(en), order = cfLines(en).order.filter(o => o !== k), target = tr.dataset.cfsec ? '§' + tr.dataset.cfsec : tr.dataset.cfk, at = order.indexOf(target);
  if (at >= 0 && target !== k){ order.splice(cfDropAt(tr, ev.clientY) ? at + 1 : at, 0, k); L.order = order; save(); }
  render(); });
document.addEventListener('dragend', () => { CFDRAG = null; document.querySelectorAll('tr[data-cfk][draggable=true]').forEach(x => { x.draggable = false; }); document.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after')); });

/* year controls live in the nav */
function renderYearActions(){}
document.addEventListener('DOMContentLoaded', () => {
  load();
  const c = client(); if (c && !c.engagements.find(e => e.id === UI.engId)) UI.engId = c.engagements[c.engagements.length - 1].id;
  render();
  if (location.protocol !== 'file:' && DB.settings.clientId) Drive.loadGis().catch(() => {});
});
document.getElementById('report-css').textContent = REPORT_CSS;
</script>
