# Builds the Fair Tax Portal Android app (APK) and publishes it as the latest release:
# https://github.com/AsifKhan170920/audit-desk/releases/latest/download/FairTaxPortal.apk
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        working-directory: android-app
        run: |
          npx cap add android
          node scripts/prepare-android.js
          npx cap sync android

      - name: Add signing key
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/android/app/release.keystore

      - name: Build APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FairTaxPortal.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Fair Tax Portal app – build ${{ github.run_number }}
          body: |
            Android app for the Fair Tax Portal (CRM, Audit Desk, reminders).
            Install: open this page on the phone, download FairTaxPortal.apk and allow installing from your browser.
            Signed with the Fair Tax release key: ${{ env.HAS_KEYSTORE }}
          files: FairTaxPortal.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: FairTaxPortal-apk
          path: FairTaxPortal.apk
