<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kazabooks – offline</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;font:15px "Segoe UI",system-ui,Arial,sans-serif;color:#14284b}.card{background:#fff;border-radius:14px;padding:28px 32px;max-width:420px;text-align:center;box-shadow:0 8px 30px rgba(20,40,75,.12)}.k{width:52px;height:52px;border-radius:14px;background:#14284b;color:#fff;font:800 26px/52px "Segoe UI",Arial,sans-serif;margin:0 auto 10px}button{margin-top:14px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;padding:10px 18px;cursor:pointer;font-size:14px}</style></head>
<body><div class="card"><div class="k">K</div><h2>No internet connection</h2><p>Kazabooks keeps your data on the Kazabooks server, so it needs the internet. Check the connection, then try again.</p>
<button id="again">Try again</button></div>
<script>
  var to = new URLSearchParams(location.search).get('to') || '';
  document.getElementById('again').onclick = function () { location.href = /^https:\/\/(test\.)?kazabooks\.com\//.test(to) ? to : 'https://kazabooks.com/'; };
  addEventListener('online', function () { document.getElementById('again').click(); });
</script></body></html>
